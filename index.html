<style>
/* Layout: phone-first app shell. Sticky status header, scrolling content, fixed bottom tab bar
   that turns into a side rail on wide screens. Yellow price tag = selling price;
   plum + lock = manager-only numbers. */
:root {
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#E7EDEF; --ink:#10242B; --muted:#566A72; --line:#D2DCE0;
  --brand:#0B6E7F; --brand-ink:#FFFFFF; --brand-soft:#DAEDF0;
  --tag:#FFD84D; --tag-ink:#2A2100;
  --private:#7A3568; --private-soft:#F4E6F0;
  --good:#146F46; --good-soft:#DCF0E6; --warn:#8A4B00; --warn-soft:#FBEBCF; --bad:#B02E22; --bad-soft:#F9E0DC;
  --shadow:rgb(8 24 30 / .14); --scrim:rgb(6 16 20 / .55);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:14px; --r-sm:9px; --nav-h:62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0C1619; --surface:#132227; --surface-2:#1B3038; --ink:#E7EFF1; --muted:#93A8B0; --line:#27404A;
    --brand:#45B9CB; --brand-ink:#04222A; --brand-soft:#123943;
    --tag:#F0C63A; --tag-ink:#221A00;
    --private:#DE98D0; --private-soft:#38203A;
    --good:#56CB96; --good-soft:#103526; --warn:#F2AE4C; --warn-soft:#3A2A0C; --bad:#F48476; --bad-soft:#40201B;
    --shadow:rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .62); color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0C1619; --surface:#132227; --surface-2:#1B3038; --ink:#E7EFF1; --muted:#93A8B0; --line:#27404A;
  --brand:#45B9CB; --brand-ink:#04222A; --brand-soft:#123943;
  --tag:#F0C63A; --tag-ink:#221A00;
  --private:#DE98D0; --private-soft:#38203A;
  --good:#56CB96; --good-soft:#103526; --warn:#F2AE4C; --warn-soft:#3A2A0C; --bad:#F48476; --bad-soft:#40201B;
  --shadow:rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .62); color-scheme:dark;
}
* { box-sizing:border-box }
html { -webkit-text-size-adjust:100% }
body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5 }
body.lock { overflow:hidden }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface) }
button, input, textarea, select { font-family:inherit }
:where(button,a,input,textarea,select):focus-visible { outline:2px solid var(--brand); outline-offset:2px }
.gutter { padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
.ic { flex:none }
.grow { flex:1; min-width:0 }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.stack { display:flex; flex-direction:column; gap:12px }
.h { margin:0; font:600 17px/1.35 var(--font-display); text-wrap:balance }
.h.small { font-size:15px }
.sub { margin:0; color:var(--muted); font-size:13px }
.lbl { font:600 12.5px var(--font-body); color:var(--muted) }
.code { font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate }
.nm { min-width:0; overflow-wrap:anywhere; font-weight:500 }

/* Login */
.login { display:flex; flex-direction:column; gap:18px; max-width:440px; margin-inline:auto; padding-block:40px }
.login-brand { display:flex; flex-direction:column; gap:6px }
.logo { width:54px; height:54px; border-radius:14px 14px 14px 4px; background:var(--tag); color:var(--tag-ink); display:grid; place-items:center }
.login-brand h1 { margin:8px 0 0; font:700 40px/1.15 var(--font-display) }
.login-brand p { margin:0; color:var(--muted); max-width:34ch }
.who { display:grid; gap:12px }
.who button { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center; text-align:start; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; color:var(--ink); cursor:pointer }
.who .wi { grid-row:1 / 3; width:46px; height:46px; border-radius:12px; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand) }
.who .admin .wi { background:var(--private-soft); color:var(--private) }
.who b { font:600 17px var(--font-display) }
.who small { color:var(--muted); font-size:13px; grid-column:2 }
.demo-chip { color:var(--warn); background:var(--warn-soft); border-radius:99px; padding:4px 12px; font:600 12px var(--font-body) }

/* Shell */
.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line) }
.top-in { display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; padding-block:10px; max-width:1100px; margin-inline:auto }
.brandmark { font:700 19px var(--font-display) }
.role { font:600 11px var(--font-body); padding:2px 9px; border-radius:99px; background:var(--brand-soft); color:var(--brand) }
.role.is-admin { background:var(--private-soft); color:var(--private) }
.sync { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-inline-start:auto }
.dot { width:9px; height:9px; border-radius:50%; background:var(--good); flex:none }
.dot.buy { background:var(--brand) }
.dot.off { background:var(--muted) }
.rate { font:600 13px var(--font-display); font-variant-numeric:tabular-nums; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px; padding:5px 12px; cursor:pointer; unicode-bidi:isolate }
.rate:disabled { opacity:1; cursor:default }
.demo-strip { background:var(--warn-soft); color:var(--warn); font:600 11.5px var(--font-body); text-align:center; padding:3px 16px }
main { display:flex; flex-direction:column; gap:14px; max-width:1100px; margin-inline:auto; padding-block:14px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px)) }
.nav { position:fixed; inset:auto 0 0 0; z-index:6; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
.nav-in { display:flex; max-width:560px; margin-inline:auto }
.nav button { position:relative; flex:1; min-width:0; height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:0; color:var(--muted); font:500 11.5px var(--font-body); cursor:pointer }
.nav button[aria-current="page"] { color:var(--brand); font-weight:600 }
.badge { position:absolute; top:7px; inset-inline-start:calc(50% + 6px); min-width:17px; height:17px; border-radius:99px; background:var(--tag); color:var(--tag-ink); font:700 10.5px/17px var(--font-display); font-style:normal; text-align:center; padding:0 4px }

/* Controls */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-sm); padding:9px 14px; font:600 14px var(--font-body); cursor:pointer; min-height:42px; text-decoration:none }
.btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink) }
.btn.ghost { background:none }
.btn.danger { color:var(--bad) }
.btn:disabled { opacity:.5; cursor:not-allowed }
.x { width:36px; height:36px; flex:none; border-radius:8px; border:0; background:none; color:var(--muted); cursor:pointer; display:grid; place-items:center }
.field { display:flex; flex-direction:column; gap:5px; min-width:0 }
.field label { font:600 12.5px var(--font-body); color:var(--muted) }
.input { width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-sm); padding:10px 12px; font:400 15px var(--font-body); min-height:44px }
textarea.input { min-height:130px; resize:vertical; line-height:1.6 }
.input.mini { width:92px; min-height:38px; padding:6px 8px; text-align:center; font-variant-numeric:tabular-nums }
.input.mini:invalid { border-color:var(--warn); background:var(--warn-soft) }
input[type="checkbox"] { width:22px; height:22px; accent-color:var(--brand) }
.seg { display:flex; background:var(--surface-2); border-radius:var(--r-sm); padding:3px; gap:3px }
.seg button { flex:1; min-width:0; border:0; background:none; color:var(--muted); font:600 13px var(--font-body); padding:8px 6px; border-radius:7px; cursor:pointer }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px var(--shadow) }
.seg.small { flex:none }
.seg.small button { padding:6px 14px }
.search { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0 12px; height:48px; color:var(--muted) }
.search input { flex:1; min-width:0; height:100%; border:0; background:none; color:var(--ink); font:400 15px var(--font-body); outline:none }
.search:focus-within { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft) }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none }
.chips::-webkit-scrollbar { display:none }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:6px 14px; font:500 13px var(--font-body); cursor:pointer; white-space:nowrap; min-height:36px }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink) }
.pill { display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:2px 10px; font:600 12px var(--font-body); font-variant-numeric:tabular-nums }
.pill.ok { background:var(--good-soft); color:var(--good) }
.pill.low { background:var(--warn-soft); color:var(--warn) }
.pill.out { background:var(--bad-soft); color:var(--bad) }
.pill.new { background:var(--brand-soft); color:var(--brand) }
.asbtn { border:0; cursor:pointer; min-height:30px }

/* Items */
.grid { display:grid; gap:10px; grid-template-columns:minmax(0,1fr) }
.grid > .empty { grid-column:1 / -1 }
.item { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); display:flex; flex-direction:column; min-width:0 }
.item-main { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; width:100%; padding:12px 14px; background:none; border:0; border-radius:var(--r) var(--r) 0 0; color:inherit; text-align:start; cursor:pointer }
.item-txt { display:flex; flex-direction:column; gap:6px; min-width:0 }
.item-name { font:600 15px/1.4 var(--font-body); overflow-wrap:anywhere }
.meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; color:var(--muted); font-size:12.5px }
.price { display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none }
.tag { background:var(--tag); color:var(--tag-ink); font:700 17px var(--font-display); font-variant-numeric:tabular-nums; padding:3px 10px; border-radius:6px 6px 6px 2px; direction:ltr; unicode-bidi:isolate; white-space:nowrap }
.tag.big { font-size:22px; padding:4px 12px }
.tag.sm { font-size:14.5px }
.syp { font:500 12.5px var(--font-display); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap }
.syp.big { font-size:15px; color:var(--ink) }
.item-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px dashed var(--line); padding:8px 14px }
.secret, .floor { display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px 6px; min-width:0; font-size:12.5px; font-variant-numeric:tabular-nums }
.secret { color:var(--private) }
.floor { color:var(--muted) }
.secret b, .floor b { font-weight:600 }
.add { display:inline-flex; align-items:center; gap:5px; flex:none; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px; padding:5px 12px; font:600 12.5px var(--font-body); cursor:pointer; min-height:34px }
@keyframes flash { from { box-shadow:0 0 0 3px var(--tag) } to { box-shadow:0 0 0 0 transparent } }
.item.flash { animation:flash 1.8s ease-out }
.empty { margin:0; text-align:center; color:var(--muted); padding:28px 12px; border:1px dashed var(--line); border-radius:var(--r) }

/* Panels, quote, offers, overview */
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:12px; min-width:0 }
.qline, .orow, .prow { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line) }
.qline { flex-wrap:wrap }
.qsum { font:600 15px var(--font-display); font-variant-numeric:tabular-nums }
.stepper { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; margin-inline-start:auto }
.stepper button { width:38px; height:38px; border:0; background:var(--surface-2); color:var(--ink); font:600 18px var(--font-display); cursor:pointer }
.stepper output { min-width:44px; text-align:center; font:600 15px var(--font-display); font-variant-numeric:tabular-nums }
.total { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; border-top:2px solid var(--ink); padding-top:12px; font:600 15px var(--font-display) }
.quote-text { min-height:110px; font-size:13px }
.pin { display:inline-flex; align-items:center; gap:6px; flex:none }
.cur { font-size:12px; color:var(--muted) }
.manual { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap }
.manual .field:first-child { flex:1 1 180px }
.manual .field:nth-child(2) { flex:0 1 110px }
.kpis { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:2px; min-width:0; text-align:start; color:inherit; font-size:inherit }
.kpi span { color:var(--muted); font-size:12.5px }
.kpi b { font:700 20px var(--font-display); font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
.kpi small { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums }
button.kpi { cursor:pointer }
.feed { list-style:none; margin:0; padding:0 }
.feed li { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line) }
.feed time { color:var(--muted); font-size:12.5px }

/* Detail sheet and toast */
.scrim { position:fixed; inset:0; z-index:20; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center }
.sheet { background:var(--surface); color:var(--ink); width:100%; max-width:560px; max-height:88%; overflow:auto; border-radius:18px 18px 0 0; display:flex; flex-direction:column; gap:14px; padding-top:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
.facts { margin:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px }
.facts div { min-width:0 }
.facts dt { color:var(--muted); font-size:12px }
.facts dd { margin:0; font:600 14.5px var(--font-body); font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
.private-box { background:var(--private-soft); color:var(--private); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:10px }
.private-box dt { color:var(--private); opacity:.85 }
.priv-title { font:600 12.5px var(--font-body); gap:6px }
.toast { position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px)); z-index:30; display:flex; justify-content:center; pointer-events:none; padding-inline:16px }
.toast span { background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font:500 13.5px var(--font-body); box-shadow:0 6px 20px var(--shadow) }

/* Unlock screen */
.unlock { max-width:360px }
.backbtn { align-self:flex-start; padding-inline:10px }
.flip { display:inline-flex }
[dir="rtl"] .flip { transform:scaleX(-1) }
.bio { display:flex; flex-direction:column; gap:10px }
.pinbox { display:flex; flex-direction:column; gap:10px; align-items:center }
.dots { display:flex; gap:14px }
.dots i { width:16px; height:16px; border-radius:50%; border:2px solid var(--muted) }
.dots i.on { background:var(--ink); border-color:var(--ink) }
.dots.err i { border-color:var(--bad) }
.pad { display:grid; grid-template-columns:repeat(3,72px); gap:12px; direction:ltr }
.pad button { height:60px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 22px var(--font-display); cursor:pointer; display:grid; place-items:center }
.who .guest .wi { background:var(--surface-2); color:var(--ink) }
.exitbtn { min-height:34px; padding:4px 12px; font-size:13px }

/* Lowest price for employees: unlabelled, shown only on request */
.peek { display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:34px; border:0; border-radius:99px; background:var(--surface-2); color:var(--muted); cursor:pointer }
.fcode { color:var(--muted); font:500 12.5px var(--font-display); letter-spacing:.08em }
.floor.code { display:inline-block }

.item-main { flex:1 }
.qline > .grow { flex:1 1 180px }
.grid > .more { grid-column:1 / -1 }
.qform { align-items:end }
.qform.even { grid-template-columns:repeat(2,minmax(0,1fr)) }

/* Quote form, totals and the printable preview */
.qform { display:grid; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:10px }
.sumline { display:flex; justify-content:space-between; gap:12px; padding:5px 0; color:var(--muted); font-variant-numeric:tabular-nums }
.sheet.doc { max-width:640px }
.doc-prev { display:flex; flex-direction:column; gap:10px }
.doc-prev img { display:block; width:100%; border:1px solid var(--line); border-radius:6px }
.facts.one { grid-template-columns:minmax(0,1fr) }

@media (min-width:700px) {
  .scrim { align-items:center }
  .sheet { border-radius:18px }
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)) }
}
@media (min-width:900px) {
  .shell { padding-inline-start:92px }
  .nav { inset:0 auto 0 auto; inset-inline-start:0; width:92px; border-top:0; border-inline-end:1px solid var(--line); padding:calc(env(safe-area-inset-top,0px) + 76px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px) }
  .nav-in { flex-direction:column; gap:4px }
  .nav button { flex:none; width:100% }
  main { padding-bottom:30px }
  .toast { bottom:24px }
  .kpis { grid-template-columns:repeat(4,minmax(0,1fr)) }
}
@media (min-width:1100px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)) } }
@media (prefers-reduced-motion: reduce) { .item.flash { animation:none } }

/* Base rules for a page that stands on its own */
:root { color-scheme:light }
html { padding-top:env(safe-area-inset-top,0px) }
body { margin:0 }
img { max-width:100% }
[hidden] { display:none !important }

/* Sign-in, waiting and lock screens */
.signin { display:flex; flex-direction:column; gap:12px }
.signin .btn { min-height:46px; font-size:15px }
.msg { margin:0; color:var(--bad); font:600 13px var(--font-body); min-height:20px }
.or { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12.5px }
.or::before, .or::after { content:""; flex:1; height:1px; background:var(--line) }
.center { align-items:center; text-align:center; padding-block:72px }
.center .logo { margin-inline:auto }
.spin { width:34px; height:34px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--brand); animation:spin .9s linear infinite }
@keyframes spin { to { transform:rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration:4s } }

/* Small additions */
.person { display:flex; flex-direction:column; min-width:0 }
.person small { color:var(--muted); font-size:12px; overflow-wrap:anywhere }
.check { display:flex; align-items:center; gap:10px; cursor:pointer }
.check input { width:20px; height:20px; accent-color:var(--brand); flex:none }
.tag.none { background:var(--surface-2); color:var(--muted) }
.add:disabled { opacity:.45; cursor:not-allowed }

/* Storefront: header, shelves, item cards with a drawn cover (the accounting program holds no photos) */
:root { --tint-a:#DAEDF0; --tint-b:#FBEFCB; --tint-c:#E2EEDC; --tint-d:#E7E5F4; --tint-e:#F2E6DD }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --tint-a:#123943; --tint-b:#3A3013; --tint-c:#1C3323; --tint-d:#2B2942; --tint-e:#3A2B22 }
}
:root[data-theme="dark"] { --tint-a:#123943; --tint-b:#3A3013; --tint-c:#1C3323; --tint-d:#2B2942; --tint-e:#3A2B22 }
.brandbtn { display:inline-flex; align-items:center; gap:9px; min-width:0; background:none; border:0; padding:0; color:inherit; cursor:pointer; border-radius:10px }
.brandbtn .brandmark { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px }
.logo.sm { width:34px; height:34px; border-radius:10px 10px 10px 3px; flex:none }
.iconbtn { position:relative; width:44px; height:44px; flex:none; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); display:grid; place-items:center; cursor:pointer }
.iconbtn .badge { top:-6px; inset-inline-start:auto; inset-inline-end:-6px }
.shell.guest .top-in { flex-wrap:nowrap }
.searchrow { padding-block:0 10px }
.searchrow .search { height:46px }
.shell.member .brandbtn .brandmark { display:none }
@media (min-width:640px) { .shell.member .brandbtn .brandmark { display:inline } }
body.no-nav main { padding-bottom:calc(30px + env(safe-area-inset-bottom,0px)) }
body.no-nav .shell { padding-inline-start:0 }
body.no-nav .toast { bottom:calc(24px + env(safe-area-inset-bottom,0px)) }
.chips.cats { padding-bottom:4px }
.chip.cat { display:inline-flex; align-items:center; gap:7px; font-weight:600 }
.hero { background:var(--brand); color:var(--brand-ink); border-radius:var(--r); padding:20px 18px; display:flex; flex-direction:column; gap:14px }
.hero h1 { margin:0; font:700 26px/1.2 var(--font-display); text-wrap:balance }
.hero p { margin:6px 0 0; max-width:46ch; opacity:.92 }
.hero-meta { display:flex; flex-wrap:wrap; gap:8px }
.hero .note { border:1px solid currentColor; border-radius:99px; padding:3px 12px; font:600 12.5px var(--font-body) }
.hero .btn { align-self:flex-start; background:var(--tag); border-color:var(--tag); color:var(--tag-ink) }
.shelf { display:flex; flex-direction:column; gap:10px; min-width:0 }
.shelf-row { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(150px,44%); gap:10px; overflow-x:auto; padding-bottom:8px; scroll-snap-type:x proximity; scrollbar-width:thin }
.shelf-row > * { scroll-snap-align:start }
.btn.sm { min-height:34px; padding:4px 12px; font-size:13px }
.toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.sortbox { display:inline-flex; align-items:center; gap:8px }
.select { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-sm); padding:6px 10px; font:600 13px var(--font-body); min-height:38px }
.grid.store { grid-template-columns:repeat(2,minmax(0,1fr)) }
.pcard .item-main { flex-direction:column; align-items:stretch; justify-content:flex-start; gap:8px; padding:10px 10px 8px }
.cover { position:relative; display:grid; place-items:center; aspect-ratio:4 / 3; border-radius:10px; color:var(--ink); overflow:hidden }
.cover .ic { opacity:.72 }
.cover.big { aspect-ratio:auto; height:150px; flex:none }
.cbrand { position:absolute; inset-block-start:8px; inset-inline-start:10px; font:700 11px var(--font-display); letter-spacing:.06em; direction:ltr; opacity:.72 }
.k-a { background:var(--tint-a) }
.k-b { background:var(--tint-b) }
.k-c { background:var(--tint-c) }
.k-d { background:var(--tint-d) }
.k-e { background:var(--tint-e) }
.pcard .item-name { font:500 13.5px/1.45 var(--font-body); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden }
.specs { display:flex; flex-wrap:wrap; gap:4px }
.specs i { font:600 11px var(--font-body); font-style:normal; background:var(--surface-2); border-radius:6px; padding:2px 7px; white-space:nowrap;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; unicode-bidi:plaintext }
.pcard .price { align-items:flex-start; margin-top:auto }
.pcard .tag { font-size:16px }
.pcard .secret { padding:0 10px 8px; font-size:12px }
.pcard .item-foot { padding:8px 10px; gap:6px; flex-wrap:wrap }
.pcard .pill { font-size:11.5px }
.pcard .add { width:40px; height:40px; padding:0; justify-content:center; border-radius:12px; margin-inline-start:auto; background:var(--brand); border-color:var(--brand); color:var(--brand-ink) }
.sheet.product { max-width:640px }
@media (min-width:700px) {
  .shelf-row { grid-auto-columns:210px }
  .grid.store { grid-template-columns:repeat(3,minmax(0,1fr)) }
  .hero { padding:28px 26px }
  .hero h1 { font-size:32px }
}
@media (min-width:1000px) { .grid.store { grid-template-columns:repeat(4,minmax(0,1fr)) } }

/* Supplier offers: a row holds the model, its spec chips, notes and the worked-out selling price */
.ocol { display:flex; flex-direction:column; gap:5px }
.num { color:var(--muted); font-weight:600; font-size:12.5px }
.onote { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere }
.calc { color:var(--private); font:600 12.5px var(--font-body); min-height:1em }
.tall { align-items:flex-start }
.tall .price, .tall .pin, .tall .x { margin-top:2px }
.msg.calm { color:var(--brand) }
.sheet.textdoc { max-width:640px }
.sheet.textdoc textarea { min-height:46vh; font-size:13.5px; line-height:1.7 }
.searchrow .iconbtn { width:46px; height:46px }
.searchrow { flex-wrap:nowrap }
.chip.need { border-style:dashed }
.btn.off { opacity:.55; pointer-events:none }

/* Real photos sit on top of the drawn cover */
.cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:var(--surface) }
.cover.big.has-photo { height:auto; aspect-ratio:4 / 3; max-height:52vh; background:var(--surface-2) }
.cover.big img { object-fit:contain; background:var(--surface-2) }

/* Barcode scanner: the camera picture with a guide line */
.scanbox { position:relative; aspect-ratio:4 / 3; border-radius:12px; overflow:hidden; background:var(--surface-2) }
.scanbox video { display:block; width:100%; height:100%; object-fit:cover }
.scanline { position:absolute; inset-inline:8%; top:50%; height:2px; background:var(--tag); box-shadow:0 0 0 1px var(--shadow) }

/* Printing shows the quote pages only */
#print-area { display:none }
@media print {
  html, body { background:#fff; padding:0 }
  body::before { display:none }
  body > *:not(#print-area) { display:none !important }
  #print-area { display:block }
  #print-area img { display:block; width:100%; break-after:page }
  @page { size:A4; margin:0 }
}
</style>
</head>

  if (!hasPrice(it)) return '<span class="tag none' + b + '">' + t(isGuest() ? 'ask_price' : 'no_price') + '</span>';
  return '<span class="tag' + b + '">' + usd(it.sell) + '</span><span class="syp' + b + '">' + sypOf(it.sell) + '</span>';
}
/* The drawing stays underneath a real photo: it shows while the photo loads, and if the photo cannot be fetched. */
function coverHtml(it, big) {
  return '<span class="cover k-' + it.tint + (big ? ' big' : '') + (it.photo ? ' has-photo' : '') + '">' + icon(it.kind, big ? 72 : 44) +
    (it.brandName && !it.photo ? '<b class="cbrand">' + esc(it.brandName) + '</b>' : '') +
    (it.photo ? '<img src="' + esc(photoUrl(it.photo, !big)) + '" alt="" loading="lazy" decoding="async" onerror="this.hidden=true">' : '') + '</span>';
}
function chipsHtml(it, all) {
  var list = all ? it.chips : it.chips.slice(0, 3);
  return list.length ? '<span class="specs">' + list.map(function (c) { return '<i>' + esc(c) + '</i>'; }).join('') + '</span>' : '';
}
function itemCard(it) {
  var extra = isAdmin()
    ? '<div class="secret">' + icon('lock', 13) + t('cost') + ' <b>' + usd(it.cost) + '</b>' + (hasPrice(it) ? ' · <b>' + num(marginPct(it), 1) + '%</b>' : '') +
      (it.pending ? ' <span class="pill low">' + t('pending') + '</span>' : '') + '</div>'
    : '';
  return '<article class="item pcard" data-card="' + it.id + '">' +
    '<button class="item-main" data-action="open" data-id="' + it.id + '">' + coverHtml(it) +
    '<span class="item-name" dir="auto">' + esc(it.name) + '</span>' + chipsHtml(it) +
    '<span class="price">' + priceHtml(it) + '</span></button>' + extra +
    '<div class="item-foot"><span class="pill ' + stockState(it) + '">' + stockLabel(it) + '</span>' + (isAdmin() || isGuest() ? '' : floorHtml(it)) +
    '<button class="add" data-action="add" data-id="' + it.id + '" aria-label="' + addLabel() + '" title="' + addLabel() + '"' + (hasPrice(it) ? '' : ' disabled') + '>' + icon('plus', 18) + '</button></div></article>';
}

/* ---------- One item, opened ---------- */
function addLabel() { return t(isGuest() ? 'add_request' : 'add_quote'); }
function fact(k, v) { return '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
/* Manager only: where the cost comes from, and the stock held elsewhere. */
function realFacts(it) {
  var h = '', b = it.buy, sl = it.sale, cur;
  function ltr(v) { return '<span class="code">' + esc(v) + '</span>'; }   // numbers and dates keep their own order inside Arabic text
  if (b && b.usd > 0) {
    cur = state.curs[b.cur];
    h += fact(t('last_buy'), (b.cur && b.cur !== state.baseCur && b.curPrice > 0 ? ltr(num(b.curPrice, 2)) + ' ' + esc(cur ? cur.name : '') + ' = ' : '') +
      ltr(usd(b.usd)) + (b.date ? ' · ' + ltr(b.date) : ''));
  }
  if (sl && sl.usd > 0) {
    h += fact(t('last_sale'), ltr(usd(sl.usd)) + (sl.date ? ' · ' + ltr(sl.date) : '') + ' · ' + t('min_max', { a: ltr(usd(sl.min)), b: ltr(usd(sl.max)) }));
  }
  if (it.other.length) {
    h += fact(t('other_wh'), it.other.map(function (o) { return '<span dir="auto">' + esc(o.wh) + ': ' + num(o.n, 0) + '</span>'; }).join(' · '));
  }

}
function priceInputs(it) {
  var extra = state.pricing.extra[it.id], manual = state.pricing.manual[it.id], auto = autoPrice(it);
  var attrs = ' type="number" inputmode="decimal" min="0" step="any" data-id="' + it.id + '"';
  return '<div class="qform even"><div class="field"><label for="px-extra">' + t('extra_cost') + '</label><input class="input" id="px-extra" data-change="extra"' + attrs + ' value="' + (extra > 0 ? extra : '') + '"></div>' +
    '<div class="field"><label for="px-manual">' + t('manual_price') + '</label><input class="input" id="px-manual" data-change="manual"' + attrs + ' value="' + (manual > 0 ? manual : '') + '"></div></div>' +
    '<p class="sub">' + t('auto_price', { p: auto === null ? t('no_price') : usd(auto) }) + '</p>';
}
function specFacts(it) {
  var sp = it.sp, h = it.brandName ? fact(t('spec_brand'), esc(it.brandName)) : '';
  function ltr(v) { return '<span class="code">' + esc(v) + '</span>'; }
  if (!sp) return h;
  h += fact(t('spec_cpu'), ltr(sp.cpuLabel) + (sp.gen ? ' · ' + t('spec_gen', { n: sp.gen }) : ''));
  if (sp.ram) h += fact(t('spec_ram'), ltr(sp.ram + 'GB'));
  if (sp.disk) h += fact(t('spec_storage'), ltr(sp.disk + (sp.diskKind ? ' ' + sp.diskKind : '')));
  if (sp.gpu) h += fact(t('spec_gpu'), ltr(sp.gpu));
  if (sp.screen) h += fact(t('spec_screen'), ltr(sp.screen) + (sp.touch ? ' · ' + t('spec_touch') : ''));
  return h;
}
function openItem(id) {
  var it = byId(id);
  if (!it) return;
  stopScan();
  var priced = hasPrice(it), like = similarTo(it);
  var facts = specFacts(it) + fact(t('code'), '<span class="code">' + esc(it.code) + '</span>') +
    (isGuest() || !it.barcode ? '' : fact(t('barcode'), '<span class="code">' + esc(it.barcode) + '</span>')) +
    fact(t('category'), '<span dir="auto">' + esc(catName(catOf(it))) + '</span>') +
    (isAdmin() || isGuest() || !priced ? '' : fact(t('ref'), floorHtml(it)));
  var html = '<div class="sheet product" role="dialog" aria-modal="true" aria-label="' + esc(it.name) + '">' +
    '<div class="row"><h2 class="h grow" dir="auto">' + esc(it.name) + '</h2><button class="x" id="sheet-close" data-action="close" aria-label="' + t('close') + '">' + icon('x') + '</button></div>' +
    coverHtml(it, true) +
    '<div class="row">' + priceHtml(it, true) + '<span class="pill ' + stockState(it) + '">' + stockLabel(it) + '</span></div>' +
    '<dl class="facts">' + facts + '</dl>';
  if (isAdmin()) {
    var best = bestOfferFor(it), f = floorPrice(it);
    html += '<div class="private-box"><div class="row priv-title">' + icon('lock', 15) + t('admin_only') + '</div><dl class="facts">' +
      fact(t('cost'), usd(it.cost) + ' · ' + sypOf(it.cost) + (it.pending ? ' <span class="pill low">' + t('pending') + '</span>' : '')) +
      (priced ? fact(t('profit_unit'), usd(it.sell - it.cost)) + fact(t('margin'), num(marginPct(it), 1) + '%') + fact(t('floor'), usd(f) + ' · ' + sypOf(f)) : '') + '</dl>' +
      '<dl class="facts one">' + fact(t('stock_value'), usd(it.cost * totalQty(it))) +
      fact(t('best_offer'), best ? '<span dir="auto">' + esc(best.supplier) + '</span> · ' + usd(best.usd) + ' ' + cmpPill(best.usd, it.cost) : t('none_yet')) +
      realFacts(it) + '</dl>' + priceInputs(it) + photoControls(it) + '</div>';
  }
  var line = it.name + (priced ? '\n' + usd(it.sell) + ' (' + sypOf(it.sell) + ')' : '');
  html += '<div class="row"><button class="btn primary grow" data-action="add" data-id="' + it.id + '" data-close="1"' + (priced ? '' : ' disabled') + '>' + icon('plus', 18) + addLabel() + '</button>' +
    (isGuest()
      ? (state.shop.phone ? '<a class="btn grow" target="_blank" rel="noopener" href="' + esc(shopWa(t('ask_item', { name: it.name, code: it.code }) + '\n' + itemLink(it))) + '">' + icon('chat', 18) + t('ask_whatsapp') + '</a>' : '')
      : '<a class="btn grow" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(line + '\n' + state.shop.name + '\n' + itemLink(it)) + '">' + icon('send', 18) + t('share_price') + '</a>') +
    (navigator.share ? '<button class="btn" data-action="share" data-id="' + it.id + '">' + icon('send', 18) + t('share') + '</button>'
      : '<button class="btn" data-action="copylink" data-id="' + it.id + '">' + icon('copy', 18) + t('copy_link') + '</button>') + '</div>';
  if (like.length) html += '<section class="shelf"><h3 class="h small">' + t('similar') + '</h3><div class="shelf-row">' + like.map(function (o) { return itemCard(o); }).join('') + '</div></section>';
  html += '</div>';
  var sh = $('#sheet');
  sh.innerHTML = html;
  sh.hidden = false;
  var fresh = state.sheetId !== id;
  state.sheetId = id;
  state.sheetSig = sheetSig(it);
  document.body.classList.add('lock');

/* ---------- Quote for a customer, or a guest's price request ---------- */
function quoteText() {
  var q = quoteCalc(), guest = isGuest(), who = state.quoteCustomer.trim();
  var out = [state.shop.name, t(guest ? 'request_title' : 'quote_title') + ' ' + quoteNo() + ' · ' + new Date().toLocaleDateString('en-GB')];
  if (!guest && who) out.push(t('customer') + ': ' + who);
  q.lines.forEach(function (l) { out.push('- ' + l.it.name + ' × ' + l.n + ' = ' + usd(l.it.sell * l.n)); });
  if (q.disc > 0) {
    out.push(t('subtotal') + ': ' + usd(q.sub));
    out.push(t('discount') + ' ' + num(q.pct, 1) + '%: -' + usd(q.disc));
  }
  out.push(t('total') + ': ' + usd(q.total) + ' (' + sypOf(q.total) + ')');
  if (!guest) out.push(t('doc_valid', { n: state.shop.validDays }));
  return out.join('\n');
}
function waLink(text, toShop) {

}
function sumHtml(q) {

    ? '<div class="sumline"><span>' + t('subtotal') + '</span><span class="code">' + usd(q.sub) + '</span></div>' +
      '<div class="sumline"><span>' + t('discount') + ' ' + num(q.pct, 1) + '%</span><span class="code">-' + usd(q.disc) + '</span></div>'
    : '') +
    '<div class="total"><span>' + t('total') + '</span><span class="price"><span class="tag big">' + usd(q.total) + '</span><span class="syp big">' + sypOf(q.total) + '</span></span></div>';
}
function viewQuote() {
  var q = quoteCalc(), guest = isGuest(), title = t(guest ? 'request_title' : 'quote_title');
  var backBtn = guest ? '<button class="btn" data-action="home">' + icon('back', 18) + t('continue_shop') + '</button>' : '';
  if (!q.lines.length) return '<section class="panel"><h2 class="h">' + title + '</h2><p class="empty">' + t(guest ? 'request_empty' : 'quote_empty') + '</p>' + backBtn + '</section>';
  var rows = q.lines.map(function (l) {
    var tot = l.it.sell * l.n;
    return '<div class="qline"><div class="grow"><div class="nm" dir="auto">' + esc(l.it.name) + '</div><div class="meta"><span class="code">' + usd(l.it.sell) + ' × ' + l.n + '</span></div></div>' +
      '<div class="price"><b class="qsum code">' + usd(tot) + '</b><span class="syp">' + sypOf(tot) + '</span></div>' +
      '<div class="stepper"><button data-action="qdec" data-id="' + l.it.id + '" aria-label="-1">−</button><output>' + l.n + '</output>' +
      '<button data-action="qinc" data-id="' + l.it.id + '" aria-label="+1">+</button></div></div>';
  }).join('');
  var text = quoteText();
  var form = guest ? '' : '<div class="qform"><div class="field"><label for="q-cust">' + t('customer') + '</label><input class="input" id="q-cust" data-input="qcust" dir="auto" autocomplete="off" value="' + esc(state.quoteCustomer) + '"></div>' +
    '<div class="field"><label for="q-disc">' + t('discount_pct') + '</label><input class="input" id="q-disc" data-input="qdisc" type="number" inputmode="decimal" min="0" max="100" step="any" value="' + (state.quoteDisc || '') + '"></div></div>';
  var copyBtn = '<button class="btn grow" data-action="copy">' + icon('copy', 18) + t('copy') + '</button>';
  var actions = guest
    ? (state.shop.phone ? '<a class="btn primary grow" id="wa-link" target="_blank" rel="noopener" href="' + esc(waLink(text, true)) + '">' + icon('chat', 18) + t('send_shop') + '</a>' : '') + copyBtn
    : '<button class="btn primary grow" data-action="doc">' + icon('file', 18) + t('pdf') + '</button>' + copyBtn +
      '<a class="btn grow" id="wa-link" target="_blank" rel="noopener" href="' + esc(waLink(text, false)) + '">' + icon('chat', 18) + t('whatsapp') + '</a>';
  return '<section class="panel"><h2 class="h">' + title + '</h2><div>' + rows + '</div>' + form + '<div id="q-sum">' + sumHtml(q) + '</div>' +
    '<div class="row">' + actions + '<button class="btn ghost danger" data-action="qclear">' + t('clear') + '</button></div>' +
    '<textarea class="input quote-text" id="quote-text" readonly dir="auto" hidden>' + esc(text) + '</textarea>' + backBtn + '</section>';
}
function paintQuoteSum() {
  var el = $('#q-sum');
  if (!el) return;
  el.innerHTML = sumHtml(quoteCalc());
  var text = quoteText(), a = $('#wa-link'), ta = $('#quote-text');
  if (a) a.href = waLink(text, isGuest());
  if (ta) ta.value = text;
}
function copyQuote() {
  var text = quoteText();
  function fail() {
    var ta = $('#quote-text');
    if (ta) { ta.hidden = false; ta.focus(); ta.select(); }
    toast(t('copy_fail'));
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { toast(t('copied')); }, fail);
  } else fail();

/* ---------- Printable quote: drawn on A4 canvases, shown as a preview, saved as a PDF or printed ----------
   The browser shapes Arabic text on the canvas; each page then goes into the PDF as one JPEG. */
var docPages = [];
function fontsReady() {
  try {
    if (document.fonts && document.fonts.load) {
      var all = Promise.all(['700 44px "Readex Pro"', '400 23px "IBM Plex Sans Arabic"', '600 23px "IBM Plex Sans Arabic"']
        .map(function (f) { return document.fonts.load(f); })).then(null, function () {});
      /* fonts that cannot be fetched must not hold the quote back */
      return Promise.race([all, new Promise(function (res) { setTimeout(res, 2500); })]);
    }
  } catch (e) { /* draw with fallback fonts */ }
  return Promise.resolve();
}
function drawQuotePages() {
  var W = 1190, H = 1684, M = 84, rtl = state.lang === 'ar', q = quoteCalc();
  var FB = '"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif', FD = '"Readex Pro", ' + FB;
  var INK = '#10242B', MUTE = '#5B6B72', LINE = '#D5DDE1', BAND = '#EEF3F4', TAG = '#FFD84D';   // ink on white paper
  var pages = [], ctx, y;
  function sx(d) { return rtl ? W - M - d : M + d; }   // d px in from the edge where a line starts
  function ex(d) { return rtl ? M + d : W - M - d; }   // d px in from the edge where a line ends
  function text(s, x, yy, font, color, side) {
    s = String(s);
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.direction = /[֐-ࣿ]/.test(s) ? 'rtl' : 'ltr';
    ctx.textAlign = side === 'center' ? 'center' : ((side === 'start') === rtl ? 'right' : 'left');
    ctx.fillText(s, x, yy);
  }
  function wrap(s, font, maxW) {
    ctx.font = font;
    var lines = [], cur = '';
    String(s).split(/\s+/).forEach(function (w) {
      var next = cur ? cur + ' ' + w : w;
      if (cur && ctx.measureText(next).width > maxW) { lines.push(cur); cur = w; } else cur = next;
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  }
  function rule(yy, color, h) { ctx.fillStyle = color; ctx.fillRect(M, yy, W - 2 * M, h); }
  function newPage() {
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    ctx = cv.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);
    pages.push(cv);
    text(state.shop.name, sx(0), M + 40, '700 44px ' + FD, INK, 'start');
    if (state.shop.phone) text(state.shop.phone, sx(0), M + 78, '400 22px ' + FB, MUTE, 'start');
    text(t('doc_title'), ex(0), M + 36, '600 34px ' + FD, INK, 'end');
    text(t('doc_no') + ' ' + quoteNo(), ex(0), M + 72, '400 22px ' + FB, MUTE, 'end');
    text(t('doc_date') + ' ' + new Date().toLocaleDateString('en-GB'), ex(0), M + 102, '400 22px ' + FB, MUTE, 'end');
    rule(M + 124, TAG, 6);
    y = M + 176;
  }
  function tableHead() {
    rule(y - 32, BAND, 48);
    var f = '600 22px ' + FB;
    text(t('doc_item'), sx(16), y, f, INK, 'start');
    text(t('doc_qty'), ex(430), y, f, INK, 'center');
    text(t('doc_price'), ex(215), y, f, INK, 'end');
    text(t('doc_total'), ex(16), y, f, INK, 'end');
    y += 54;
  }
  function sumRow(label, value, strong) {
    text(label, ex(250), y, (strong ? '600 26px ' : '400 23px ') + FB, INK, 'end');
    text(value, ex(16), y, strong ? '700 30px ' + FD : '400 23px ' + FB, INK, 'end');
    y += strong ? 46 : 38;
  }
  newPage();
  var who = state.quoteCustomer.trim(), body = '400 23px ' + FB;
  if (who) { text(t('customer') + ': ' + who, sx(0), y, '400 24px ' + FB, INK, 'start'); y += 52; }
  tableHead();
  q.lines.forEach(function (l) {
    var lines = wrap(l.it.name, body, W - 2 * M - 506), rowH = lines.length * 32 + 26;
    if (y + rowH > H - M - 80) { newPage(); tableHead(); }
    lines.forEach(function (ln, k) { text(ln, sx(16), y + k * 32, body, INK, 'start'); });
    text(l.n, ex(430), y, body, INK, 'center');
    text(usd(l.it.sell), ex(215), y, body, INK, 'end');
    text(usd(l.it.sell * l.n), ex(16), y, '600 23px ' + FB, INK, 'end');
    rule(y + (lines.length - 1) * 32 + 18, LINE, 1);
    y += rowH;
  });
  if (y + 260 > H - M - 80) newPage();
  y += 24;
  if (q.disc > 0) {
    sumRow(t('subtotal'), usd(q.sub));
    sumRow(t('discount') + ' ' + num(q.pct, 1) + '%', '-' + usd(q.disc));
  }
  sumRow(t('total'), usd(q.total), true);
  text(sypOf(q.total), ex(16), y, '600 24px ' + FB, INK, 'end');
  y += 38;
  text(t('doc_rate') + ': $1 = ' + sypOf(1), ex(16), y, '400 20px ' + FB, MUTE, 'end');
  pages.forEach(function (p, i) {
    ctx = p.getContext('2d');
    rule(H - M - 44, LINE, 1);
    text(t('doc_valid', { n: state.shop.validDays }) + (state.shop.note ? ' ' + state.shop.note : ''), sx(0), H - M - 10, '400 20px ' + FB, MUTE, 'start');
    text(t('doc_page', { a: i + 1, b: pages.length }), ex(0), H - M - 10, '400 20px ' + FB, MUTE, 'end');
  });
  return pages;
}
function strBytes(s) { var a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; }
function dataUrlBytes(url) { return strBytes(atob(url.split(',')[1])); }
/* Minimal PDF 1.4 writer: one A4 page per JPEG image. */
function pdfFromJpegs(imgs) {
  var parts = [], offs = [], pos = 0, total = 3 + imgs.length * 3;
  function push(x) { var b = typeof x === 'string' ? strBytes(x) : x; parts.push(b); pos += b.length; }
  function obj(n, body) { offs[n] = pos; push(n + ' 0 obj\n' + body + '\nendobj\n'); }
  push('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + imgs.map(function (im, i) { return (3 + i * 3) + ' 0 R'; }).join(' ') + '] /Count ' + imgs.length + ' >>');
  imgs.forEach(function (im, i) {
    var p = 3 + i * 3, draw = 'q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ' + (p + 1) + ' 0 R >> >> /Contents ' + (p + 2) + ' 0 R >>');
    offs[p + 1] = pos;
    push((p + 1) + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + im.bytes.length + ' >>\nstream\n');
    push(im.bytes);
    push('\nendstream\nendobj\n');
    obj(p + 2, '<< /Length ' + draw.length + ' >>\nstream\n' + draw + '\nendstream');
  });
  var xref = pos, table = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for (var n = 1; n < total; n++) table += ('0000000000' + offs[n]).slice(-10) + ' 00000 n \n';
  push(table + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}
function buildPdf() {
  return pdfFromJpegs(docPages.map(function (p) { return { w: p.width, h: p.height, bytes: dataUrlBytes(p.toDataURL('image/jpeg', 0.9)) }; }));
}
function pdfName() { return 'quote-' + quoteNo() + '.pdf'; }
function pdfFile() { try { return new File([buildPdf()], pdfName(), { type: 'application/pdf' }); } catch (e) { return null; } }
function canShareFile() {
  try { var f = pdfFile(); return !!(f && navigator.canShare && navigator.share && navigator.canShare({ files: [f] })); } catch (e) { return false; }
}
function openDoc() {
  fontsReady().then(function () {
    docPages = drawQuotePages();
    var sh = $('#sheet');
    sh.innerHTML = '<div class="sheet doc" role="dialog" aria-modal="true" aria-label="' + t('doc_title') + '">' +

/* ---------- Helper libraries, fetched only when a tool is first used ---------- */
var scriptJobs = {};
/* Tries each address in turn. ready() tells whether the library has arrived. */
function loadScript(urls, ready) {
  var key = urls[0];
  if (ready()) return Promise.resolve();
  if (scriptJobs[key]) return scriptJobs[key];
  scriptJobs[key] = new Promise(function (resolve, reject) {
    var i = 0;
    (function next() {
      if (i >= urls.length) { delete scriptJobs[key]; reject(new Error('library failed to load')); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function () { if (ready()) resolve(); else next(); };
      s.onerror = function () { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
  return scriptJobs[key];
}

/* ---------- Pictures: opened upright, drawn to a size, saved as JPEG ---------- */
function viaImg(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('not a picture')); };
    img.src = url;
  });
}
function loadPicture(file) {   // a phone photo carries its rotation in the file; both ways honour it
  try {
    if (window.createImageBitmap) return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return viaImg(file); });
  } catch (e) { /* an older browser that does not take the option: the plain way below */ }
  return viaImg(file);
}
function drawTo(img, w, h) {

/* ---------- Reading a supplier's price list from a picture (manager) ----------
   The text reader is fetched the first time (a few megabytes) and runs on this device; the picture is not
   sent anywhere. Each picture is read twice: Latin letters and digits come out best from the Latin reader
   alone, Arabic needs the reader that knows Arabic. Both readings cut the picture into the same lines, so
   they are paired by place and each line is taken from the reading that suits it. The result lands in the

}

    if (w * h * k * k > 12e6) k = Math.sqrt(12e6 / (w * h));

    if (best && share > (l.y1 - l.y0) / 2) {

/* ---------- Excel / CSV import (reader loads only when a file is picked) ---------- */
var RE_PRICE_HEAD = new RegExp(LEXICON.priceHead, 'i'), RE_SKIP_HEAD = new RegExp(LEXICON.skipHead, 'i');

}

    rows[i].forEach(function (c, j) { if (priceCol < 0 && RE_PRICE_HEAD.test(normalize(c))) { priceCol = j; head = i; } });
  }
  if (priceCol < 0) {
    rows.forEach(function (r) { var d = parseOfferLine(r.filter(Boolean).join(' | '), defCur); if (d) out.push(d); });
    return out;
  }
  var title = rows[head][priceCol], cur = new RegExp(LEXICON.syp, 'i').test(title) ? 'SYP' : (new RegExp(LEXICON.usd, 'i').test(title) ? 'USD' : defCur);
  rows[head].forEach(function (c, j) { if (RE_SKIP_HEAD.test(normalize(c))) skip[j] = true; });
  rows.slice(head + 1).forEach(function (r) {
    var price = toNumber(toLatinDigits(r[priceCol] || '').replace(/[^\d.,]/g, ''), cur);
    var name = r.filter(function (c, j) { return c && j !== priceCol && !skip[j]; }).join(' ').replace(/\s+/g, ' ').trim();

}
function readText(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(String(r.result || '')); };
    r.onerror = function () { reject(r.error); };

  });
}
function importFile(file) {
  if (/\.txt$/i.test(file.name || '') || file.type === 'text/plain') {   // a list saved as plain text is read like pasted text
    readText(file).then(function (text) {
      state.pasteText = text; state.offerMode = 'paste';
      setDraft(parseOfferText(text, state.draftCur));
      paintTab();
      if (!state.draft.length) toast(t('file_fail'));
    }, function () { toast(t('file_fail')); });
    return;
  }
  Promise.all([loadXlsx(), readFile(file)]).then(function (res) {
    var XLSX = res[0];

    var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' })
      .map(function (r) { return r.map(function (c) { return String(c).trim(); }); });
    setDraft(rowsToOffers(rows, state.draftCur));
    paintDraft();
    if (!state.draft.length) toast(t('file_fail'));
  }).catch(function () { toast(t('file_fail')); });
}

  else if (a === 'refresh') { el.disabled = true; reload().then(function () { toast(t(pcOnline() ? 'pc_on' : 'pc_off')); }, function () { toast(t('net_fail')); paintTab(); }); }
  else if (a === 'cat') { state.cat = el.getAttribute('data-cat'); state.brand = ''; state.cpu = ''; state.ram = ''; state.limit = 60; paintItems(); window.scrollTo(0, 0); }
  else if (a === 'low') { state.lowOnly = !state.lowOnly; state.limit = 60; paintItems(); }
  else if (a === 'instock') { state.inStockOnly = !state.inStockOnly; state.limit = 60; paintItems(); }
  else if (a === 'brand' || a === 'cpu' || a === 'ram' || a === 'need') toggle(a, el.getAttribute('data-v'));
  else if (a === 'scan') openScan();
  else if (a === 'phdel') removePhoto(id);
  else if (a === 'share') {
    p = byId(id);
    if (p && navigator.share) navigator.share({ title: p.name, text: p.name + (hasPrice(p) ? ' - ' + usd(p.sell) : ''), url: itemLink(p) }).catch(function () { /* closed without sharing */ });
  }
  else if (a === 'copylink') {
    p = byId(id);
    if (p && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(itemLink(p)).then(function () { toast(t('link_copied')); }, function () { toast(t('copy_fail')); });
    else toast(t('copy_fail'));
  }
  else if (a === 'more') { state.limit += 60; paintItems(); }
  else if (a === 'golow') { resetStore(); state.lowOnly = true; state.inStockOnly = true; goTab('items'); }
  else if (a === 'open') openItem(id);
  else if (a === 'close') closeSheet();
  else if (a === 'peek') peek(id);
  else if (a === 'add') {
    p = byId(id);
    if (!p || !hasPrice(p)) { toast(t('cant_add')); return; }
    cart()[id] = (cart()[id] || 0) + 1;
    save(); paintBadge(); toast(t(isGuest() ? 'added_request' : 'added'));
    if (el.getAttribute('data-close')) closeSheet();
  }
  else if (a === 'qinc' || a === 'qdec') {
    n = (cart()[id] || 0) + (a === 'qinc' ? 1 : -1);
    if (n > 0) cart()[id] = n; else delete cart()[id];
    save(); paintTab(); paintBadge();
  }
  else if (a === 'qclear') {
    if (isGuest()) state.gquote = {};
    else { state.quote = {}; state.quoteDisc = 0; state.quoteCustomer = ''; }
    save(); paintTab(); paintBadge();
  }
  else if (a === 'copy') copyQuote();
  else if (a === 'doc') openDoc();
  else if (a === 'pdfsave') savePdf();
  else if (a === 'pdfshare') sharePdf();
  else if (a === 'print') printDoc();
  else if (a === 'omode') {
    state.offerMode = el.getAttribute('data-mode');
    setDraft(state.offerMode === 'paste' ? parseOfferText(state.pasteText, state.draftCur) : []);
    paintTab();
  }
  else if (a === 'dcur') {
    state.draftCur = el.getAttribute('data-cur');
    if (state.offerMode === 'paste') setDraft(parseOfferText(state.pasteText, state.draftCur));
    else state.draft.forEach(function (d) { if (!d.explicit) d.cur = state.draftCur; });
    paintTab();
  }
  else if (a === 'drm') { state.draft.splice(Number(el.getAttribute('data-i')), 1); paintDraft(); }
  else if (a === 'dsave') saveDraft();
  else if (a === 'orm') { state.offers = state.offers.filter(function (o) { return o.id !== id; }); paintOffers(); paintDraftFoot(); removeOffer(id); }
  else if (a === 'oclist') openList(el.getAttribute('data-sup'));
  else if (a === 'listcopy') copyList();
  else if (a === 'listshare') { p = $('#list-text'); if (p && navigator.share) navigator.share({ text: p.value }).catch(function () { /* closed without sharing */ }); }
  else if (a === 'osupdel') {
    p = el.getAttribute('data-sup');
    n = state.offers.filter(function (o) { return o.supplier === p; }).map(function (o) { return o.id; });
    if (n.length && window.confirm(t('del_supplier_q', { name: p, n: n.length }))) { removeOffers(n); paintOffers(); paintDraftFoot(); }
  }
  else if (a === 'sypmode') { state.sypMode = el.getAttribute('data-mode'); state.sypAuto = false; saveSetting('money'); paintTab(); }
  else if (a === 'floormode') { state.floorMode = el.getAttribute('data-mode'); saveSetting('floor'); paintTab(); }
  else if (a === 'lockmin') { state.lockMin = Number(el.getAttribute('data-min')); save(); paintTab(); }
  else if (a === 'pact') {   // approve a waiting account, or switch an active one off
    p = person(id);
    if (p) { p.active = !p.active; paintTab(); setPerson(id, { active: p.active }); }
  }
  else if (a === 'prole') {
    p = person(id);
    if (p && (p.role === 'admin' || window.confirm(t('make_admin_q', { name: p.name || p.email })))) {
      p.role = p.role === 'admin' ? 'staff' : 'admin';
      paintTab(); setPerson(id, { role: p.role });
    }
  }
});

document.addEventListener('input', function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute('data-input'), v, d, ex;
  if (!k) return;
  if (k === 'q') {   // a new search looks through the whole store, not only the group that was open
    if (!state.query.trim() && el.value.trim()) { state.cat = 'all'; state.brand = ''; state.cpu = ''; state.ram = ''; }
    state.query = el.value; state.limit = 60; paintItems();
  }
  else if (k === 'defmargin') { v = parseFloat(el.value); if (v >= 0) { state.pricing.defMargin = v; reprice(); saveRules(); } }
  else if (k === 'lowat') {
    v = parseInt(el.value, 10);
    if (v >= 0) { state.pricing.lowAt = v; state.items.forEach(function (it) { it.min = v; }); saveSetting('floor'); }
  }
  else if (k === 'gmargin') {
    v = parseFloat(el.value); d = el.getAttribute('data-cat');
    if (v >= 0) state.pricing.margins[d] = v; else delete state.pricing.margins[d];
    reprice(); saveGroup(d);
  }
  else if (k === 'gshow') {
    d = el.getAttribute('data-cat');
    if (el.checked) delete state.pricing.hidden[d]; else state.pricing.hidden[d] = true;
    saveGroup(d);
  }
  else if (k === 'gueston') { state.guestOn = el.checked; saveSetting('guest'); }
  else if (k === 'paste') { state.pasteText = el.value; setDraft(parseOfferText(el.value, state.draftCur)); paintDraft(); }
  else if (k === 'supplier') { state.supplier = el.value; paintDraftFoot(); }
  else if (k === 'replold') { state.replaceOld = el.checked; state.replaceTouched = true; }
  else if (k === 'omargin') {   // profit % for supplier offers; empty goes back to the general one
    v = parseFloat(el.value);
    state.offerMargin = v >= 0 ? v : null;
    saveSetting('offers'); paintDraft(); paintOfferRows();
  }
  else if (k === 'ofilter') { state.offerQuery = el.value; paintOfferRows(); }
  else if (k === 'dprice') {
    d = state.draft[Number(el.getAttribute('data-i'))];
    v = parseFloat(el.value);
    if (d) {
      d.price = v > 0 ? v : null;
      ex = $('#dc-' + el.getAttribute('data-i'));
      if (ex) ex.textContent = draftCalc(d);
      paintDraftFoot();
    }
  }
  else if (k === 'qcust') { state.quoteCustomer = el.value; save(); paintQuoteSum(); }
  else if (k === 'qdisc') {
    v = parseFloat(el.value) || 0;
    if (v > discountCap()) { v = discountCap(); el.value = v; toast(t('disc_capped')); }
    state.quoteDisc = Math.max(0, v);
    save(); paintQuoteSum();
  }
  else if (k === 'disc') { v = parseFloat(el.value); if (v >= 0 && v <= 100) { state.maxDiscount = v; saveSetting('floor'); } }
  else if (k === 'shopname') { state.shop.name = el.value; saveSetting('shop'); }
  else if (k === 'shopphone') { state.shop.phone = el.value; saveSetting('shop'); }
  else if (k === 'shopnote') { state.shop.note = el.value; saveSetting('shop'); }
  else if (k === 'validdays') { v = parseInt(el.value, 10); if (v > 0) { state.shop.validDays = v; saveSetting('shop'); } }
  else if (k === 'codeword') {
    v = el.value.toUpperCase().replace(/\s/g, '');
    ex = $('#code-ex');
    if (validWord(v)) { state.codeWord = v; saveSetting('floor'); if (ex) ex.textContent = codeExample(); }
    else if (ex) ex.textContent = t('code_bad');
  }
});

document.addEventListener('change', function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute('data-change'), id, v, it;
  if (el.id === 'file' && el.files && el.files[0]) importFile(el.files[0]);
  else if (el.id === 'shot' && el.files && el.files.length) readOfferPictures(el.files);
  else if (el.id === 'ph-file' && el.files && el.files[0]) setPhoto(el.getAttribute('data-id'), el.files[0]);
  else if (k === 'sort') { state.sort = el.value; state.limit = 60; paintItems(); }
  else if (k === 'extra' || k === 'manual') {   // manager's per-item adjustments, applied when the field is left
    id = el.getAttribute('data-id'); v = parseFloat(el.value); it = byId(id);
    if (!it) return;
    if (v > 0) state.pricing[k][id] = v; else delete state.pricing[k][id];
    resolveItem(it);
    savePricing(id);
    if (state.tab === 'items') paintItems();
    openItem(id);
  }
});

document.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target.getAttribute('data-form');
  if (f === 'signin') {
    var email = $('#si-email').value.trim(), pass = $('#si-pass').value;
    if (!email || !pass) { state.authMsg = t('bad_login'); paintSignIn(); return; }
    signIn(email, pass);
  } else if (f === 'scancode') {
    onScanned($('#scan-code').value);
  } else if (f === 'manual') {
    var name = $('#m-name').value.trim(), price = parseFloat($('#m-price').value);
    if (name && price > 0) {
      state.draft.push({ name: name, price: price, cur: state.draftCur, explicit: true });
      paintTab();
      var again = $('#m-name');
      if (again) again.focus();
    }
  }
});

document.addEventListener('keydown', function (e) {
  var hits;
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  else if (e.key === 'Enter' && e.target && e.target.id === 'q' && !isGuest()) {   // a hand scanner types the code and presses Enter
    hits = itemsByCode(e.target.value);
    if (hits.length === 1) { e.preventDefault(); openItem(hits[0].id); }
  }
});
window.addEventListener('afterprint', function () { $('#print-area').innerHTML = ''; });
window.addEventListener('hashchange', routeHash);

/* ---------- Lock after no activity (only when fingerprint or face unlock is on) ---------- */
var lastAct = Date.now();
['pointerdown', 'keydown'].forEach(function (ev) {
  document.addEventListener(ev, function () { lastAct = Date.now(); }, true);
});
setInterval(function () {
  if (state.screen === 'app' && !isGuest() && bioId() && state.lockMin > 0 && Date.now() - lastAct > state.lockMin * 60000) lockApp();
}, 5000);

/* ---------- Keeping in step with the cloud ---------- */
setInterval(poll, CLOUD.pollMs);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) flushLater(); else poll();
});
window.addEventListener('online', poll);

/* ---------- Start ---------- */
load();
render();
bioCheck();
if (!state.session) enterGuest();                      // the store opens at once, no sign-in asked
else if (bioId()) { state.screen = 'locked'; render(); }
else startSession();
})();
</script>
</body>
</html>
