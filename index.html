<style>
/* Layout: phone-first app shell. Sticky status header, scrolling content, fixed bottom tab bar
   that turns into a side rail on wide screens. Yellow price tag = selling price;
   plum + lock = manager-only numbers. */
:root {
  --bg:#F2F5F6; --surface:#FFFFFF; --surface-2:#E7EDEF; --ink:#10242B; --muted:#566A72; --line:#D2DCE0;
  --brand:#0B6E7F; --brand-ink:#FFFFFF; --brand-soft:#DAEDF0;
  --tag:#FFD84D; --tag-ink:#2A2100;
  --private:#7A3568; --private-soft:#F4E6F0;
  --good:#146F46; --good-soft:#DCF0E6; --warn:#8A4B00; --warn-soft:#FBEBCF; --bad:#B02E22; --bad-soft:#F9E0DC;
  --shadow:rgb(8 24 30 / .14); --scrim:rgb(6 16 20 / .55);
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:14px; --r-sm:9px; --nav-h:62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0C1619; --surface:#132227; --surface-2:#1B3038; --ink:#E7EFF1; --muted:#93A8B0; --line:#27404A;
    --brand:#45B9CB; --brand-ink:#04222A; --brand-soft:#123943;
    --tag:#F0C63A; --tag-ink:#221A00;
    --private:#DE98D0; --private-soft:#38203A;
    --good:#56CB96; --good-soft:#103526; --warn:#F2AE4C; --warn-soft:#3A2A0C; --bad:#F48476; --bad-soft:#40201B;
    --shadow:rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .62); color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0C1619; --surface:#132227; --surface-2:#1B3038; --ink:#E7EFF1; --muted:#93A8B0; --line:#27404A;
  --brand:#45B9CB; --brand-ink:#04222A; --brand-soft:#123943;
  --tag:#F0C63A; --tag-ink:#221A00;
  --private:#DE98D0; --private-soft:#38203A;
  --good:#56CB96; --good-soft:#103526; --warn:#F2AE4C; --warn-soft:#3A2A0C; --bad:#F48476; --bad-soft:#40201B;
  --shadow:rgb(0 0 0 / .45); --scrim:rgb(0 0 0 / .62); color-scheme:dark;
}
* { box-sizing:border-box }
html { -webkit-text-size-adjust:100% }
body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5 }
body.lock { overflow:hidden }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface) }
button, input, textarea, select { font-family:inherit }
:where(button,a,input,textarea,select):focus-visible { outline:2px solid var(--brand); outline-offset:2px }
.gutter { padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
.ic { flex:none }
.grow { flex:1; min-width:0 }
.row { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.stack { display:flex; flex-direction:column; gap:12px }
.h { margin:0; font:600 17px/1.35 var(--font-display); text-wrap:balance }
.h.small { font-size:15px }
.sub { margin:0; color:var(--muted); font-size:13px }
.lbl { font:600 12.5px var(--font-body); color:var(--muted) }
.code { font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate }
.nm { min-width:0; overflow-wrap:anywhere; font-weight:500 }

/* Login */
.login { display:flex; flex-direction:column; gap:18px; max-width:440px; margin-inline:auto; padding-block:40px }
.login-brand { display:flex; flex-direction:column; gap:6px }
.logo { width:54px; height:54px; border-radius:14px 14px 14px 4px; background:var(--tag); color:var(--tag-ink); display:grid; place-items:center }
.login-brand h1 { margin:8px 0 0; font:700 40px/1.15 var(--font-display) }
.login-brand p { margin:0; color:var(--muted); max-width:34ch }
.who { display:grid; gap:12px }
.who button { display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center; text-align:start; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; color:var(--ink); cursor:pointer }
.who .wi { grid-row:1 / 3; width:46px; height:46px; border-radius:12px; display:grid; place-items:center; background:var(--brand-soft); color:var(--brand) }
.who .admin .wi { background:var(--private-soft); color:var(--private) }
.who b { font:600 17px var(--font-display) }
.who small { color:var(--muted); font-size:13px; grid-column:2 }
.demo-chip { color:var(--warn); background:var(--warn-soft); border-radius:99px; padding:4px 12px; font:600 12px var(--font-body) }

/* Shell */
.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--surface); border-bottom:1px solid var(--line) }
.top-in { display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; padding-block:10px; max-width:1100px; margin-inline:auto }
.brandmark { font:700 19px var(--font-display) }
.role { font:600 11px var(--font-body); padding:2px 9px; border-radius:99px; background:var(--brand-soft); color:var(--brand) }
.role.is-admin { background:var(--private-soft); color:var(--private) }
.sync { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-inline-start:auto }
.dot { width:9px; height:9px; border-radius:50%; background:var(--good); flex:none }
.dot.buy { background:var(--brand) }
.dot.off { background:var(--muted) }
.rate { font:600 13px var(--font-display); font-variant-numeric:tabular-nums; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px; padding:5px 12px; cursor:pointer; unicode-bidi:isolate }
.rate:disabled { opacity:1; cursor:default }
.demo-strip { background:var(--warn-soft); color:var(--warn); font:600 11.5px var(--font-body); text-align:center; padding:3px 16px }
main { display:flex; flex-direction:column; gap:14px; max-width:1100px; margin-inline:auto; padding-block:14px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px)) }
.nav { position:fixed; inset:auto 0 0 0; z-index:6; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
.nav-in { display:flex; max-width:560px; margin-inline:auto }
.nav button { position:relative; flex:1; min-width:0; height:var(--nav-h); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; background:none; border:0; color:var(--muted); font:500 clamp(10px, 3.2vw, 11.5px) var(--font-body); cursor:pointer }
.nav button span { max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }   /* a tab name stays on one line, smaller on small phones */
.nav button[aria-current="page"] { color:var(--brand); font-weight:600 }
.badge { position:absolute; top:7px; inset-inline-start:calc(50% + 6px); min-width:17px; height:17px; border-radius:99px; background:var(--tag); color:var(--tag-ink); font:700 10.5px/17px var(--font-display); font-style:normal; text-align:center; padding:0 4px }

/* Controls */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-sm); padding:9px 14px; font:600 14px var(--font-body); cursor:pointer; min-height:42px; text-decoration:none }
.btn.primary { background:var(--brand); border-color:var(--brand); color:var(--brand-ink) }
.btn.ghost { background:none }
.btn.danger { color:var(--bad) }
.btn:disabled { opacity:.5; cursor:not-allowed }
/* A button keeps its label whole: a row of buttons wraps onto the next line instead of squeezing them, and the ones
   that stretch share what is left of their line. Only a label wider than the whole row breaks, inside a button as
   wide as the row. Text beside buttons keeps a readable width the same way. */
.btn { min-width:fit-content; max-width:100%; text-align:center }
.btn.grow { flex:1 1 auto }
.row > span.grow:not(:empty), .row > label.grow:not(.btn) { flex:1 1 8em }
.x { width:36px; height:36px; flex:none; border-radius:8px; border:0; background:none; color:var(--muted); cursor:pointer; display:grid; place-items:center }
.field { display:flex; flex-direction:column; gap:5px; min-width:0 }
.field label { font:600 12.5px var(--font-body); color:var(--muted) }
.input { width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:var(--r-sm); padding:10px 12px; font:400 15px var(--font-body); min-height:44px }
textarea.input { min-height:130px; resize:vertical; line-height:1.6 }
.input.mini { width:92px; min-height:38px; padding:6px 8px; text-align:center; font-variant-numeric:tabular-nums }
.input.mini:invalid { border-color:var(--warn); background:var(--warn-soft) }
input[type="checkbox"] { width:22px; height:22px; accent-color:var(--brand) }
.seg { display:flex; flex-wrap:wrap; background:var(--surface-2); border-radius:var(--r-sm); padding:3px; gap:3px }
.seg button { flex:1; min-width:fit-content; border:0; background:none; color:var(--muted); font:600 13px var(--font-body); padding:8px 6px; border-radius:7px; cursor:pointer }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px var(--shadow) }
.seg.small { flex:none }
.seg.small button { padding:6px 14px }
.search { display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0 12px; height:48px; color:var(--muted) }
.search input { flex:1; min-width:0; height:100%; border:0; background:none; color:var(--ink); font:400 15px var(--font-body); outline:none }
.search:focus-within { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft) }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none }
.chips::-webkit-scrollbar { display:none }
.chip { flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:6px 14px; font:500 13px var(--font-body); cursor:pointer; white-space:nowrap; min-height:36px }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink) }
.pill { display:inline-flex; align-items:center; gap:5px; border-radius:99px; padding:2px 10px; font:600 12px var(--font-body); font-variant-numeric:tabular-nums }
.pill.ok { background:var(--good-soft); color:var(--good) }
.pill.low { background:var(--warn-soft); color:var(--warn) }
.pill.out { background:var(--bad-soft); color:var(--bad) }
.pill.new { background:var(--brand-soft); color:var(--brand) }
.asbtn { border:0; cursor:pointer; min-height:30px }

/* Items */
.grid { display:grid; gap:10px; grid-template-columns:minmax(0,1fr) }
.grid > .empty { grid-column:1 / -1 }
.item { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); display:flex; flex-direction:column; min-width:0 }
.item-main { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; width:100%; padding:12px 14px; background:none; border:0; border-radius:var(--r) var(--r) 0 0; color:inherit; text-align:start; cursor:pointer }
.item-txt { display:flex; flex-direction:column; gap:6px; min-width:0 }
.item-name { font:600 15px/1.4 var(--font-body); overflow-wrap:anywhere }
.meta { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; color:var(--muted); font-size:12.5px }
.price { display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none }
.tag { background:var(--tag); color:var(--tag-ink); font:700 17px var(--font-display); font-variant-numeric:tabular-nums; padding:3px 10px; border-radius:6px 6px 6px 2px; direction:ltr; unicode-bidi:isolate; white-space:nowrap }
.tag.big { font-size:22px; padding:4px 12px }
.tag.sm { font-size:14.5px }
.syp { font:500 12.5px var(--font-display); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap }
.syp.big { font-size:15px; color:var(--ink) }
.item-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px dashed var(--line); padding:8px 14px }
.secret, .floor { display:inline-flex; align-items:center; flex-wrap:wrap; gap:4px 6px; min-width:0; font-size:12.5px; font-variant-numeric:tabular-nums }
.secret { color:var(--private) }
.floor { color:var(--muted) }
.secret b, .floor b { font-weight:600 }
.add { display:inline-flex; align-items:center; gap:5px; flex:none; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:99px; padding:5px 12px; font:600 12.5px var(--font-body); cursor:pointer; min-height:34px }
@keyframes flash { from { box-shadow:0 0 0 3px var(--tag) } to { box-shadow:0 0 0 0 transparent } }
.item.flash { animation:flash 1.8s ease-out }
.empty { margin:0; text-align:center; color:var(--muted); padding:28px 12px; border:1px dashed var(--line); border-radius:var(--r) }

/* Panels, quote, offers, overview */
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:12px; min-width:0 }
/* A one-line panel (the reminders on the overview): its text and its button side by side, only as tall as the line */
.panel.row { flex-direction:row; align-items:center; gap:10px; padding:10px 14px }
.qline, .orow, .prow { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line) }
.qline { flex-wrap:wrap }
.qsum { font:600 15px var(--font-display); font-variant-numeric:tabular-nums }
.stepper { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; margin-inline-start:auto }
.stepper button { width:38px; height:38px; border:0; background:var(--surface-2); color:var(--ink); font:600 18px var(--font-display); cursor:pointer }
.stepper output { min-width:44px; text-align:center; font:600 15px var(--font-display); font-variant-numeric:tabular-nums }
.total { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; border-top:2px solid var(--ink); padding-top:12px; font:600 15px var(--font-display) }
.quote-text { min-height:110px; font-size:13px }
.pin { display:inline-flex; align-items:center; gap:6px; flex:none }
.cur { font-size:12px; color:var(--muted) }
.manual { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap }
.manual .field:first-child { flex:1 1 180px }
.manual .field:nth-child(2) { flex:0 1 110px }
.kpis { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:2px; min-width:0; text-align:start; color:inherit; font-size:inherit }
.kpi span { color:var(--muted); font-size:12.5px }
.kpi b { font:700 20px var(--font-display); font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
.kpi small { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums }
button.kpi { cursor:pointer }
.feed { list-style:none; margin:0; padding:0 }
.feed li { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line) }
.feed time { color:var(--muted); font-size:12.5px }

/* Detail sheet and toast */
.scrim { position:fixed; inset:0; z-index:20; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center }
.sheet { background:var(--surface); color:var(--ink); width:100%; max-width:560px; max-height:88%; overflow:auto; border-radius:18px 18px 0 0; display:flex; flex-direction:column; gap:14px; padding-top:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)) }
.facts { margin:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px }
.facts div { min-width:0 }
.facts dt { color:var(--muted); font-size:12px }
.facts dd { margin:0; font:600 14.5px var(--font-body); font-variant-numeric:tabular-nums; overflow-wrap:anywhere }
.private-box { background:var(--private-soft); color:var(--private); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:10px }
.private-box dt { color:var(--private); opacity:.85 }
.dqty { display:flex; align-items:center; gap:8px }
.qrbox { display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px; border:1px solid var(--line); border-radius:var(--r); text-align:center }
.qrimg { width:240px; max-width:100%; aspect-ratio:1; display:grid; place-items:center; background:#fff; border-radius:8px }
.qrimg svg { display:block; width:100%; height:100% }
.qline .qsrc, .qline .qspec { display:block; font-size:12px; color:var(--muted) }
.qrlabel { width:62mm; margin:12mm; padding:4mm; border:1px dashed #888; display:flex; flex-direction:column; align-items:center; gap:2mm;
  color:#000; background:#fff; font:10pt/1.35 system-ui, sans-serif; text-align:center }
.qrlabel svg { width:40mm; height:40mm }
.qrlabel small { font-size:8pt }
/* Ordering a supplier's device on WhatsApp (staff), and correcting an offer or a supplier after saving */
.order-box { border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:8px }
.order-box .orow { align-items:center; flex-wrap:wrap; gap:8px }
.order-box .h { display:flex; align-items:center; gap:6px }
.wa-add { display:flex; gap:6px; align-items:center }
.walink { display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--muted) }
.oedit { display:flex; flex-direction:column; gap:10px; padding:12px 0; border-bottom:1px solid var(--line) }
.priv-title { font:600 12.5px var(--font-body); gap:6px }
.toast { position:fixed; left:0; right:0; bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px)); z-index:30; display:flex; justify-content:center; pointer-events:none; padding-inline:16px }
.toast span { background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:99px; font:500 13.5px var(--font-body); box-shadow:0 6px 20px var(--shadow) }

/* Unlock screen */
.unlock { max-width:360px }
.backbtn { align-self:flex-start; padding-inline:10px }
.flip { display:inline-flex }
[dir="rtl"] .flip { transform:scaleX(-1) }
.bio { display:flex; flex-direction:column; gap:10px }
.pinbox { display:flex; flex-direction:column; gap:10px; align-items:center }
.dots { display:flex; gap:14px }
.dots i { width:16px; height:16px; border-radius:50%; border:2px solid var(--muted) }
.dots i.on { background:var(--ink); border-color:var(--ink) }
.dots.err i { border-color:var(--bad) }
.pad { display:grid; grid-template-columns:repeat(3,72px); gap:12px; direction:ltr }
.pad button { height:60px; border-radius:16px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 22px var(--font-display); cursor:pointer; display:grid; place-items:center }
.who .guest .wi { background:var(--surface-2); color:var(--ink) }
.exitbtn { min-height:34px; padding:4px 12px; font-size:13px }

/* Kept on this device only: language, the open quote, the lock choice and the sign-in session. */
function stored() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null') || {}; } catch (e) { return {}; } }
function load() {
  var s = stored();
  if (s.langSet && (s.lang === 'ar' || s.lang === 'en')) { state.lang = s.lang; state.langSet = true; }
  if (s.quote && typeof s.quote === 'object') state.quote = s.quote;
  if (s.quoteDisc >= 0 && s.quoteDisc <= 100) state.quoteDisc = s.quoteDisc;
  if (typeof s.quoteCustomer === 'string') state.quoteCustomer = s.quoteCustomer;
  if (typeof s.quoteSpecs === 'boolean') state.quoteSpecs = s.quoteSpecs;
  if (typeof s.quotePhotos === 'boolean') state.quotePhotos = s.quotePhotos;
  if (s.lockMin >= 0) state.lockMin = s.lockMin;
  if (s.bioIds && typeof s.bioIds === 'object') state.bio.ids = s.bioIds;
  if (s.session && s.session.rt && s.session.uid) state.session = s.session;
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      lang: state.lang, langSet: state.langSet, quote: state.quote, quoteDisc: state.quoteDisc, quoteCustomer: state.quoteCustomer,
      quoteSpecs: state.quoteSpecs, quotePhotos: state.quotePhotos,
      lockMin: state.lockMin, bioIds: state.bio.ids, session: state.session
    }));
  } catch (e) { /* storage unavailable: nothing is remembered on this device */ }
}

/* ---------- Helpers ---------- */

function t(key, vars) {
  var s = (LOCALES[state.lang] && LOCALES[state.lang][key]) || LOCALES.en[key] || key;
  if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function esc(v) {
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];

}
function num(n, d) { return Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function usd(n) { return '$' + num(n, 2); }
function useRate() { state.rate = state.rateSrc === 'manual' && state.rateManual > 0 ? state.rateManual : state.bookRate; }
function sypFactor() { return state.sypMode === 'old' ? 100 : 1; }
function sypOf(usdValue) { return num(Math.round(usdValue * state.rate * sypFactor()), 0) + ' ' + t('syp_unit'); }
function two(n) { return ('0' + n).slice(-2); }
function clock(ts) { var d = new Date(ts); return two(d.getHours()) + ':' + two(d.getMinutes()); }
/* Time of day for today, day and month in front for older moments. */
function when(ts) {
  if (!ts) return '';
  var d = new Date(ts), now = new Date();
  if (isNaN(d)) return '';
  return (d.toDateString() === now.toDateString() ? '' : two(d.getDate()) + '/' + two(d.getMonth() + 1) + ' ') + clock(d);
}
function isAdmin() { return state.role === 'admin'; }

function guestSyp() { return isGuest() && state.guestSyp && state.rate > 0; }

function px2(v) { return guestSyp() ? '' : sypOf(v); }       // and the line under it
function byId(id) { for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i]; return null; }
function catOf(it) {
  for (var i = 0; i < state.cats.length; i++) if (state.cats[i].id === it.cat) return state.cats[i];
  return { id: '', name: '' };
}
function catName(c) {

  if (c.id && c.id === state.lapUsed) return t('grp_laptop_used');
  if (c.id && c.id.indexOf('x:') === 0) return c.id.slice(2);   // a category named by the manager for offers

/* The accounting program's new and used laptop groups, found by their names. Supplier laptops join them. */
function findLaptopGroups(groups) {
  var lap = wordRe(LEXICON.kinds.filter(function (k) { return k[0] === 'laptop'; })[0][1]), fresh = wordRe(LEXICON.conds.fresh), old = wordRe(LEXICON.conds.used);
  state.lapNew = '';

  groups.slice().sort(function (a, b) { return String(a.name).length - String(b.name).length; }).forEach(function (g) {

function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
function hasPrice(it) { return it.sell > 0; }

/* Arabic-aware text normalisation so a search for one spelling finds the other. */
function toLatinDigits(s) {
  return String(s)
    .replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })
    .replace(/[۰-۹]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); })
    .replace(/٫/g, '.').replace(/٬/g, ',');
}
function normalize(s) {
  return toLatinDigits(s).toLowerCase()
    .replace(/[ً-ْـ]/g, '')        // diacritics and tatweel
    .replace(/[آأإ]/g, 'ا')   // alef variants
    .replace(/ى/g, 'ي')                 // alef maqsura -> ya
    .replace(/ة/g, 'ه')                 // ta marbuta -> ha
    .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/\s+/g, ' ').trim();
}
function wordSet(list) { var o = {}; list.forEach(function (u) { o[normalize(u)] = true; }); return o; }

/* Name -> comparable tokens. "i5-1135G7 16GB" becomes 5, 1135, 7, 16 so two spellings of one spec agree. */
function tokensOf(s) {
  return uniq(normalize(s).replace(/([^\d\s])(\d)/g, '$1 $2').replace(/(\d)([^\d\s])/g, '$1 $2')
    .replace(/[^a-z0-9؀-ۿ]+/g, ' ').split(' ')
    .filter(function (x) { return x && !FILLER[x] && (x.length > 1 || /\d/.test(x)); }));
}
function isNumTok(x) { return /^\d+$/.test(x); }

  var c = catOf(it);
  it._hay = normalize([it.name, it.code, it.barcode || '', catName(c), it.offer ? it.offer.note : ''].join(' '));
  it._tok = tokensOf(it.name);
  it._num = it._tok.filter(isNumTok);
  it._word = it._tok.filter(function (x) { return !isNumTok(x); });
  describe(it);
}

/* ---------- Stock and price rules ---------- */
function stockState(it) { return it.stock || (it.qty <= 0 ? 'out' : (it.qty <= it.min ? 'low' : 'ok')); }
function stockLabel(it) {
  var s = stockState(it);
  if (it.offer && !it.offer.own) return t('limited');   // a supplier's goods: how many are left is not known
  if (s === 'out') return t('out_stock');
  if (isGuest()) return t(s === 'low' ? 'limited' : 'avail');   // guests never see exact quantities
  return t(s === 'low' ? 'low_stock' : 'in_stock', { n: num(it.qty, 0) });
}
function marginPct(it) { return it.sell > 0 ? (it.sell - it.cost) / it.sell * 100 : 0; }
function floorPrice(it) { return (it.sell || 0) * (1 - state.maxDiscount / 100); }

/* Letter code for the lowest price: digit 1..9,0 -> letters 1..10 of the code word. */
function validWord(w) { return typeof w === 'string' && w.length === 10 && !/[\s\d]/.test(w) && uniq(w.split('')).length === 10; }
function encodePrice(v) {
  var w = state.codeWord, s = (Math.round(v * 100) / 100).toFixed(2).replace(/\.00$/, '');

    '<button class="btn sm" data-action="ownqty" data-id="' + it.id + '" data-d="-1" aria-label="' + t('own_less') + '">' + icon('minus', 16) + '</button>' +
    '<input class="input mini" id="own-qty" data-change="ownqty" data-id="' + it.id + '" type="number" inputmode="numeric" min="0" step="1" value="' + it.offer.ownQty + '">' +

function setOwnQty(it, total) {
  var o = offerById(it.offer.ownRow), mine, others;
  if (!o || !(total >= 0)) return;
  mine = Math.max(0, Number(o.qty) || 0);
  others = Math.max(0, it.offer.ownQty - mine);   // more rows of the same device from before stay as they are
  total = Math.max(others, Math.round(total));
  if (total - others !== mine) {
    o.qty = total - others;
    it.offer.ownQty = total;
    if (it.offer.own) { it.qty = total; it.stock = ownStockOf(total); }
    sent(api('PATCH', '/rest/v1/offers?id=eq.' + encodeURIComponent(o.id), { qty: o.qty }, 'return=minimal'));
    if ($('#item-list')) paintItems();
  }
  openItem(it.id);
}

/* ---------- Printable quote: drawn on A4 canvases, shown as a preview, saved as a PDF or printed ----------
   The browser shapes Arabic text on the canvas; each page then goes into the PDF as one JPEG. */
var docPages = [];
function fontsReady() {
  try {
    if (document.fonts && document.fonts.load) {
      var all = Promise.all(['700 44px "Readex Pro"', '400 23px "IBM Plex Sans Arabic"', '600 23px "IBM Plex Sans Arabic"']
        .map(function (f) { return document.fonts.load(f); })).then(null, function () {});
      /* fonts that cannot be fetched must not hold the quote back */
      return Promise.race([all, new Promise(function (res) { setTimeout(res, 2500); })]);
    }
  } catch (e) { /* draw with fallback fonts */ }
  return Promise.resolve();
}
/* The first photo of each line, for the printable copy. One that cannot be fetched in time is left out, and the
   cloud must allow it to be drawn, so the copy can always be saved. */
function quoteThumbs(lines) {
  var out = {};
  if (!state.quotePhotos) return Promise.resolve(out);
  return Promise.all(lines.filter(function (l) { return l.it.photos && l.it.photos.length; }).map(function (l) {
    return new Promise(function (res) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () { if (img.naturalWidth) out[l.it.id] = img; res(); };
      img.onerror = function () { res(); };
      setTimeout(res, 6000);
      img.src = photoUrl(l.it.photos[0], true);
    });
  })).then(function () { return out; });
}
function drawQuotePages(thumbs) {
  var W = 1190, H = 1684, M = 84, rtl = state.lang === 'ar', q = quoteCalc(), TH = 110;
  thumbs = thumbs || {};
  var FB = '"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif', FD = '"Readex Pro", ' + FB;
  var INK = '#10242B', MUTE = '#5B6B72', LINE = '#D5DDE1', BAND = '#EEF3F4', TAG = '#FFD84D';   // ink on white paper
  var pages = [], ctx, y;
  function sx(d) { return rtl ? W - M - d : M + d; }   // d px in from the edge where a line starts
  function ex(d) { return rtl ? M + d : W - M - d; }   // d px in from the edge where a line ends
  function text(s, x, yy, font, color, side) {
    s = String(s);
    ctx.font = font;
    ctx.fillStyle = color;
    ctx.direction = /[֐-ࣿ]/.test(s) ? 'rtl' : 'ltr';
    ctx.textAlign = side === 'center' ? 'center' : ((side === 'start') === rtl ? 'right' : 'left');
    ctx.fillText(s, x, yy);
  }
  function wrap(s, font, maxW) {
    ctx.font = font;
    var lines = [], cur = '';
    String(s).split(/\s+/).forEach(function (w) {
      var next = cur ? cur + ' ' + w : w;
      if (cur && ctx.measureText(next).width > maxW) { lines.push(cur); cur = w; } else cur = next;
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  }
  function rule(yy, color, h) { ctx.fillStyle = color; ctx.fillRect(M, yy, W - 2 * M, h); }
  function thumb(img, x, top, s) {   // a photo fitted into a square, on white
    var k = Math.min(s / img.naturalWidth, s / img.naturalHeight), w = img.naturalWidth * k, h = img.naturalHeight * k;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, top, s, s);
    ctx.drawImage(img, x + (s - w) / 2, top + (s - h) / 2, w, h);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, top + 0.5, s - 1, s - 1);
  }
  function newPage() {
    var cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    ctx = cv.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, W, H);
    pages.push(cv);
    text(state.shop.name, sx(0), M + 40, '700 44px ' + FD, INK, 'start');
    if (state.shop.phone) text(state.shop.phone, sx(0), M + 78, '400 22px ' + FB, MUTE, 'start');
    text(t('doc_title'), ex(0), M + 36, '600 34px ' + FD, INK, 'end');
    text(t('doc_no') + ' ' + quoteNo(), ex(0), M + 72, '400 22px ' + FB, MUTE, 'end');
    text(t('doc_date') + ' ' + new Date().toLocaleDateString('en-GB'), ex(0), M + 102, '400 22px ' + FB, MUTE, 'end');
    rule(M + 124, TAG, 6);
    y = M + 176;
  }
  function tableHead() {
    rule(y - 32, BAND, 48);
    var f = '600 22px ' + FB;

/* ---------- Helper libraries, fetched only when a tool is first used ---------- */
var scriptJobs = {};
/* Tries each address in turn. ready() tells whether the library has arrived. */
function loadScript(urls, ready) {
  var key = urls[0];
  if (ready()) return Promise.resolve();
  if (scriptJobs[key]) return scriptJobs[key];
  scriptJobs[key] = new Promise(function (resolve, reject) {
    var i = 0;
    (function next() {
      if (i >= urls.length) { delete scriptJobs[key]; reject(new Error('library failed to load')); return; }
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload = function () { if (ready()) resolve(); else next(); };
      s.onerror = function () { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
  return scriptJobs[key];
}

/* ---------- Pictures: opened upright, drawn to a size, saved as JPEG ---------- */

  } catch (e) { /* an older browser that does not take the option: the plain way below */ }

      .toBlob(function (b) { if (b) resolve(b); else reject(new Error('not a picture')); }, 'image/jpeg', quality);
  });
}

var MAX_PHOTOS = 8;

    ? api('POST', '/rest/v1/item_media?on_conflict=item_id', [{ item_id: idNum(it), photo: list.join(',') }], 'resolution=merge-duplicates,return=minimal')
    : api('DELETE', '/rest/v1/item_media?item_id=eq.' + idNum(it), undefined, 'return=minimal');

/* ---------- Reading a supplier's price list from a picture (manager) ----------

}

/* ---------- Photos found on the internet, waiting for the manager (see the cloud file, "photos from the internet") ----------
   The cloud searches by itself, once a minute, for items in stock without a photo, one search per model. Nothing
   it finds is shown to customers: the manager picks the right picture here, and only then is it copied into the
   shop's own photo store and put on the items. */
var finds = { list: [], at: 0, picks: [], sent: {}, gone: {}, state: null };

/* Supplier goods exist only in the app: their search words are handed to the cloud when they first appear, and they
   are taken off again when they are gone (a list deleted or changed) or have a photo, so no search is spent on them. */
function wantOfferPhotos() {
  if (!isAdmin() || !state.findsOk || !state.photoAuto) return;
  var list = state.items.filter(function (it) { return it.offer && !it.photo && !state.findItems[it.id] && !finds.sent[it.id]; }),
    gone = !state.shopOk ? [] : Object.keys(state.findItems).filter(function (id) {
      var it = byId(id);
      return Number(id.slice(1)) >= 1e12 && (!it || it.photo) && !finds.gone[id];
    });
  if (gone.length) {
    gone.forEach(function (id) { finds.gone[id] = 1; delete finds.sent[id]; });
    api('POST', '/rest/v1/rpc/photo_drop', { p_items: gone.map(function (id) { return Number(id.slice(1)); }) }).then(function (r) {
      if (!r.ok) throw r;
      gone.forEach(function (id) { delete state.findItems[id]; });
    }).catch(function () { gone.forEach(function (id) { delete finds.gone[id]; }); });
  }
  if (!list.length) return;
  list.forEach(function (it) { finds.sent[it.id] = 1; });
  api('POST', '/rest/v1/rpc/photo_want', { p_items: list.map(function (it) { return { item_id: idNum(it), label: modelOf(it).label }; }) })
    .catch(function () { list.forEach(function (it) { delete finds.sent[it.id]; }); });
}
/* Searches that have pictures to choose from, with the items still without a photo, most items first. */
function reviewList() {
  var by = {};
  Object.keys(state.findItems).forEach(function (id) {
    var it = byId(id);
    if (it && !it.photo) (by[state.findItems[id]] = by[state.findItems[id]] || []).push(id);
  });
  return state.finds.filter(function (f) { return f.status === 'done' && by[f.query]; })
    .map(function (f) { return { f: f, ids: by[f.query], off: {} }; })
    .sort(function (a, b) { return b.ids.length - a.ids.length || (a.f.label < b.f.label ? -1 : 1); });
}
function findsWaiting() { return state.finds.filter(function (f) { return f.status === 'queued' || f.status === 'asked'; }).length; }
/* The searches the app keeps: still open, or with a choice being copied. Closed ones ("none fits", or every item given a
   photo) stay in the cloud only. */
var FIND_STATES = 'queued,asked,done,none,failed,saving';
function refreshFinds() {
  return Promise.all([pagesSoft('/rest/v1/photo_finds?select=query,label,kind,status,results,note,photo&status=in.(' + FIND_STATES + ')&order=query'),
    pagesSoft('/rest/v1/photo_find_items?select=item_id,query&order=item_id')]).then(function (a) { applyFinds(a[0], a[1]); });
}
function applyFinds(list, links) {
  state.findsOk = Array.isArray(list);
  state.finds = list || [];
  state.findItems = {};
  (links || []).forEach(function (r) { state.findItems['m' + r.item_id] = r.query; });
}

/* ---------- Copying the chosen picture into the shop's own photo store ---------- */
function fetchImage(url, ms) {
  var ctl = window.AbortController ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : 0;
  return fetch(url, { mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer', signal: ctl ? ctl.signal : undefined }).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.blob();
  }).then(function (b) {
    clearTimeout(timer);
    if ((b.type && !/^image\//.test(b.type)) || b.size < 1500) throw new Error('not a picture');
    return b;
  }, function (e) { clearTimeout(timer); throw e; });
}
/* The full picture from its own site when that site allows it, otherwise the search's copy (500 pixels wide). */
function fetchPicture(c) {
  return (c.url ? fetchImage(c.url, 8000) : Promise.reject(new Error('no address'))).catch(function () {
    return fetchImage(c.thumb, 12000);
  }).catch(function () { throw { copy: true }; });
}
function putPhoto(blob, n) {
  var base = 'p' + n + '-' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  return loadPicture(blob).then(function (img) { return Promise.all([jpegOf(img, 1600, 0.84), jpegOf(img, 420, 0.8)]); }).then(function (b) {
    return storageCall('POST', 'items/' + base + '.jpg', b[0], 'image/jpeg').then(function (r) {
      if (!r.ok) throw r;
      return storageCall('POST', 'items/' + base + '-s.jpg', b[1], 'image/jpeg');
    });
  }).then(function (r) { if (!r.ok) throw r; return base; });
}

function candidates(r) {
  var own = String(r.f.photo || '').split(',').filter(Boolean).map(function (b) { return { own: b }; }),
    list = (r.f.results || []).filter(function (c) { return c && c.thumb; }).slice(0, 8);
  return own.concat(list);
}
/* The pictures to choose from: a picture its site will not show hides itself. */
function candGrid(cands) {
  return '<div class="pfgrid">' + cands.map(function (c, i) {
    return '<button class="pfc" data-action="pfpick" data-i="' + i + '" aria-pressed="false">' +
      '<img src="' + esc(c.own ? photoUrl(c.own, true) : c.thumb) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.hidden=true">' +
      '<b class="pfn" hidden></b><span dir="auto">' + esc(c.own ? t('pf_before') : (c.host || '')) + '</span></button>';
  }).join('') + '</div>';
}
/* Pressing a picture adds it to the choice and pressing it again takes it out. The order of pressing is the order of
   the photos on the item: the first one is the main photo. */
function shownPicks() {
  return Array.prototype.map.call(document.querySelectorAll('#review .pfc:not([hidden]), #shoot .pfc:not([hidden]), #sug-box .pfc:not([hidden])'), function (b) { return Number(b.getAttribute('data-i')); }).slice(0, MAX_PHOTOS);
}
function allPicked() {
  var shown = shownPicks();
  return shown.length > 0 && shown.every(function (i) { return finds.picks.indexOf(i) >= 0; });
}
function pickFind(i) {
  var at = finds.picks.indexOf(i);
  if (at >= 0) finds.picks.splice(at, 1);
  else if (finds.picks.length >= MAX_PHOTOS) { toast(t('pf_max', { n: MAX_PHOTOS })); return; }
  else finds.picks.push(i);
  paintPicks();
}
function pickAllFinds() {
  finds.picks = allPicked() ? [] : finds.picks.concat(shownPicks().filter(function (i) { return finds.picks.indexOf(i) < 0; })).slice(0, MAX_PHOTOS);
  paintPicks();
}
/* Only the marks and the buttons change, so words typed below stay and the pictures do not load again. */
function paintPicks() {
  var box = $('#review') || $('#shoot') || $('#sug-box'), use, all;   // the review, or the suggestions on the quick photo screen or an item's page
  if (!box) return;
  Array.prototype.forEach.call(box.querySelectorAll('.pfc'), function (b) {
    var at = finds.picks.indexOf(Number(b.getAttribute('data-i'))), n = b.querySelector('.pfn');
    b.setAttribute('aria-pressed', String(at >= 0));
    n.textContent = at >= 0 ? String(at + 1) : '';
    n.hidden = at < 0;
  });
  use = box.querySelector('[data-action="pfuse"], [data-action="psuse"], [data-action="phuse"]');
  if (use) { use.textContent = t('pf_use', { n: finds.picks.length }); use.disabled = !finds.picks.length; }
  all = box.querySelector('[data-action="pfall"]');
  if (all) all.textContent = t(allPicked() ? 'pf_clear' : 'pf_all');
}

/* ---------- Copying in the background ----------
   A choice goes to the cloud the moment it is made (photo_job_add), so closing the page loses nothing. Any manager
   device with the app open copies the waiting choices: each of its two workers takes one (photo_job_claim), copies its
   pictures one by one in the chosen order and reports each (photo_job_step), and the cloud puts the photos on the items
   at the end (photo_job_finish). A device that stops halfway is replaced after two minutes by another one, which
   carries on from the last picture reported. */
var photoWork = { id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), busy: {}, adding: 0, done: 0, skipped: 0, trouble: false, timer: null };
function jobsLeft() { return state.photoJobs.length + photoWork.adding; }
/* The cloud copier is woken by the cloud's clock, which needs the project's address: the app hands it in once a session. */
function registerBase() {
  if (photoWork.based || !isAdmin() || !state.jobsOk) return;
  photoWork.based = true;
  api('POST', '/rest/v1/rpc/photo_set_base', { p_url: CLOUD.url }).catch(function () { photoWork.based = false; });
}
function cloudLine(s) {
  if (s.cloud === undefined) return '';
  if (s.cloud === 'ok') return t('pf_cloud_ok');
  if (s.cloud === 'off') return s.cloudCode === '401' ? t('pf_cloud_jwt') : s.cloudCode === '404' ? t('pf_cloud_none') : t('pf_cloud_err', { code: s.cloudCode || '?' });
  return t('pf_cloud_unknown');
}
function paintJobs() {
  var el = $('#pf-bg'), n = jobsLeft();
  if (el) el.textContent = n ? t('pf_bgwait', { n: n }) : '';
  el = $('#pf-note');
  if (el) el.innerHTML = photosNoteInner();
}
function dropJob(id) {
  state.photoJobs = state.photoJobs.filter(function (j) { return j !== id; });
  paintJobs();
}
function startPhotoWork() {
  if (!isAdmin() || !state.jobsOk) return;
  clearTimeout(photoWork.timer);
  photoWork.timer = null;
  [1, 2].forEach(function (slot) {
    if (photoWork.busy[slot]) return;
    photoWork.busy[slot] = true;
    photoWorker(photoWork.id + '-' + slot).catch(function (e) {
      if (e && e.gone) { sessionLost(); return; }
      photoWork.trouble = true;   // offline, or the store refused a picture: tried again in a minute
    }).then(function () {
      photoWork.busy[slot] = false;
      if (!photoWork.busy[1] && !photoWork.busy[2]) photoWorkEnded();
    });
  });
}
function photoWorker(who) {
  return api('POST', '/rest/v1/rpc/photo_job_claim', { p_device: who }).then(function (r) {
    if (!r.ok) throw r;
    return r.json && r.json.id ? copyJob(r.json, who).then(function () { return photoWorker(who); }) : null;
  });
}
/* One picture after another, so a phone never shrinks many big pictures at once and the photos keep the chosen order.
   A picture whose site refuses copying is left out; the others still go in. */
function copyJob(job, who) {
  var pics = job.pics || [], n = Number((job.items || [])[0]) || 0;
  function next(i) {
    var c = pics[i];
    if (!c) {
      return api('POST', '/rest/v1/rpc/photo_job_finish', { p_id: job.id, p_device: who }).then(function (r) {
        if (!r.ok) throw r;
        if (r.json === 'done') photoWork.done++;
        else if (r.json === 'none') toast(t('pf_bgcopy', { label: job.label }));
        dropJob(job.id);
        setTimeout(poll, 600);   // the photos show here at once; other devices hear of them by themselves
      });
    }
    return (c.own ? Promise.resolve(c.own) : fetchPicture(c).then(function (blob) { return putPhoto(blob, n); }, function (e) {
      if (e && e.copy) { photoWork.skipped++; return ''; }
      throw e;
    })).then(function (photo) {
      return api('POST', '/rest/v1/rpc/photo_job_step', { p_id: job.id, p_device: who, p_photo: photo });
    }).then(function (r) {
      if (!r.ok) throw r;
      if (r.json !== true) { dropJob(job.id); return null; }   // another device carries this choice on
      return next(i + 1);
    });
  }
  return next((job.saved || []).length);
}
/* Both workers stopped: the waiting choices are counted again. Some still waiting (another device is on them, or this
   one had trouble): tried again in a minute. None left: the manager hears that the photos are saved. */
function photoWorkEnded() {
  pagesSoft('/rest/v1/photo_jobs?select=id&order=id').then(function (list) {
    if (list) state.photoJobs = list.map(function (j) { return j.id; });
    paintJobs();
    if (state.photoJobs.length || photoWork.trouble) {
      photoWork.trouble = false;
      if (!photoWork.timer) photoWork.timer = setTimeout(startPhotoWork, 60000);
      return;
    }
    if (photoWork.done) toast(t('pf_bgdone') + (photoWork.skipped ? ' ' + t('pf_bgskip', { n: photoWork.skipped }) : ''));
    photoWork.done = 0;
    photoWork.skipped = 0;
    if (!finds.list[finds.at]) paintReview();
  }, function () { if (!photoWork.timer) photoWork.timer = setTimeout(startPhotoWork, 60000); });
}
function backToList(r) {
  var atEnd = !finds.list[finds.at];
  finds.list.push(r);
  if (atEnd) paintReview();
}

/* ---------- The review screen ---------- */
function openReview() {
  refreshFinds().then(function () {
    finds.list = reviewList();
    finds.at = 0;
    finds.picks = [];
    if (!finds.list.length && !jobsLeft()) { toast(t('pf_nothing')); return; }
    var sh = $('#sheet');
    clearSheet();
    sh.innerHTML = '<div class="sheet review" role="dialog" aria-modal="true" aria-label="' + t('pf_title') + '" id="review"></div>';
    sh.hidden = false;
    document.body.classList.add('lock');
    sheetStep('');
    paintReview();
  }, function (e) { if (e && e.gone) sessionLost(); else toast(t('net_fail')); });
}
function paintReview() {
  var box = $('#review'), r = finds.list[finds.at], cands;
  if (!box) return;
  var head = '<div class="row"><h2 class="h grow">' + t('pf_title') + '</h2>' + (r ? '<span class="sub code">' + (finds.at + 1) + ' / ' + finds.list.length + '</span>' : '') +
    '<button class="x" id="sheet-close" data-action="close" aria-label="' + t('close') + '">' + icon('x') + '</button></div>';
  if (!r) {
    box.innerHTML = head + '<p class="strong">' + t(jobsLeft() ? 'pf_bgleave' : 'pf_end') + '</p><p class="sub" id="pf-bg" role="status"></p>' +
      '<button class="btn primary" data-action="close">' + t('ps_close') + '</button>';

  }
  cands = candidates(r);
  box.innerHTML = head + '<p class="h small" dir="auto">' + esc(r.f.label) + '</p>' +
    '<p class="sub">' + t(r.ids.length > 1 ? 'ps_many' : 'ps_one', { n: r.ids.length }) + ' ' + t('pf_hint') + '</p>' +
    (r.ids.length > 1 ? '<div class="pslist">' + r.ids.map(function (id) {
      var it = byId(id);
      return it ? '<label class="check"><input type="checkbox" data-input="pfitem" data-id="' + id + '"' + (r.off[id] ? '' : ' checked') + '><span dir="auto">' + esc(it.name) + '</span></label>' : '';
    }).join('') + '</div>' : '') +
    candGrid(cands) +
    '<button class="btn ghost" data-action="pfall"></button>' +
    '<button class="btn primary" data-action="pfuse" disabled></button>' +
    '<p class="sub" id="pf-bg" role="status"></p>' +
    '<div class="row"><button class="btn ghost grow" data-action="pfreject">' + t('pf_reject') + '</button>' +
    '<button class="btn ghost grow" data-action="pfskip">' + t('ps_skip') + '</button></div>' +
    '<form class="manual" data-form="pfagain"><div class="field"><label for="pf-words">' + t('pf_words') + '</label>' +
    '<input class="input" id="pf-words" dir="auto" autocomplete="off" value="' + esc(r.f.label) + '"></div>' +
    '<button class="btn" type="submit">' + t('pf_again') + '</button></form>';
  paintPicks();

}
/* The next model starts at the top of the sheet, with nothing chosen. */
function nextReview() {
  var box = $('#review');
  finds.at++;
  finds.picks = [];
  paintReview();
  if (box) box.scrollTop = 0;
}
/* A choice goes to the cloud, which keeps it until it is copied (see above). undo: when the cloud did not take it. */
function sendChoice(f, ids, picked, undo) {
  f.status = 'saving';
  photoWork.adding++;
  /* kept alive by the browser, so the choice reaches the cloud even if the page is closed right away */
  api('POST', '/rest/v1/rpc/photo_job_add', {
    p_query: f.query,
    p_items: ids.map(function (id) { return Number(id.slice(1)); }),
    p_pics: picked.map(function (c) { return c.own ? { own: c.own } : { url: c.url || '', thumb: c.thumb }; })
  }, null, true).then(function (res) {
    photoWork.adding--;
    if (!res.ok) throw res;
    state.photoJobs = state.photoJobs.concat([res.json]);
    paintJobs();
    startPhotoWork();
  }, function (e) { photoWork.adding--; throw e; }).catch(function (e) {
    if (e && e.gone) { sessionLost(); return; }
    f.status = 'done';
    toast(t('save_fail'));
    undo();
    paintJobs();
  });
}
function useFind() {
  var r = finds.list[finds.at], cands = r ? candidates(r) : [], ids,
    picked = finds.picks.map(function (i) { return cands[i]; }).filter(Boolean);
  if (!picked.length) return;
  if (!state.jobsOk) { toast(t('pf_oldcloud')); return; }
  ids = r.ids.filter(function (id) { return !r.off[id]; });
  if (!ids.length) { toast(t('ps_noneticked')); return; }
  sendChoice(r.f, ids, picked, function () { backToList(r); });
  nextReview();
}
/* "None fits" and "search with other words" move on at once too; if the cloud does not take the decision (the reason
   is already shown), the model comes back at the end of the list as it was. */
function decideFind(action, words) {
  var r = finds.list[finds.at], was;
  if (!r) return;
  was = { status: r.f.status, label: r.f.label, results: r.f.results };
  if (action === 'reject') r.f.status = 'rejected';
  else { r.f.status = 'queued'; r.f.label = words; r.f.results = []; toast(t('pf_queued')); }
  nextReview();
  sent(api('POST', '/rest/v1/rpc/photo_decide', { p_query: r.f.query, p_action: action, p_label: words || '' })).then(function (res) {
    if (res) return;
    r.f.status = was.status; r.f.label = was.label; r.f.results = was.results;
    backToList(r);
  });
}

/* ---------- The site's suggestions on the quick photo screen ----------
   Each model there gets a button beside the internet search: the pictures the site found for it, chosen the same way
   as in the review, or a search started for it on the spot. */
function shootFindsOn() { return isAdmin() && state.findsOk && state.photoAuto; }
/* The site's search for these items: the one any of them is on. An item on a search the manager closed ("none fits")
   gets it as closed, so it can be searched again. */
function findOf(ids) {
  var q = '', i;
  for (i = 0; i < ids.length && !q; i++) q = state.findItems[ids[i]] || '';
  if (!q) return null;
  for (i = 0; i < state.finds.length; i++) if (state.finds[i].query === q) return state.finds[i];
  return { query: q, label: '', status: 'closed', results: [], photo: '' };
}
function shootFind(g) { return findOf(g.ids); }
function shootReady(f) { return !!f && f.status === 'done' && candidates({ f: f }).length > 0; }
/* pre names the screen's actions: 'ps' on the quick photo screen, 'ph' on an item's page. */
function sugButton(f, open, pre) {
  var n;

    n = candidates({ f: f }).length;
    return '<button class="btn sm' + (open ? '' : ' primary') + '" data-action="' + pre + 'sug" aria-pressed="' + !!open + '">' + icon('camera', 16) + t('ps_sug', { n: n }) + '</button>';
  }
  if (f && f.status === 'saving') return '<button class="btn sm" disabled>' + t('ps_sug_saving') + '</button>';
  if (f && (f.status === 'queued' || f.status === 'asked')) return '<button class="btn sm" disabled>' + t('ps_sug_wait') + '</button>';
  if (finds.state && !finds.state.hasKey) return '';   // no search key saved: nothing could search for it
  return '<button class="btn sm" data-action="' + pre + 'find">' + icon('search', 16) + t(f ? 'ps_sug_again' : 'ps_sug_find') + '</button>' +
    (f && f.status === 'none' ? '<span class="sub">' + t('ps_sug_none') + '</span>' : '');
}
function shootSugButton(g) { return sugButton(shootFind(g), shoot.sug, 'ps'); }
function shootSugGrid(g) {
  var f = shootFind(g), cands = shootReady(f) ? candidates({ f: f }) : [];
  if (!cands.length) return '';
  return '<p class="sub">' + t('pf_hint') + '</p>' + candGrid(cands) +
    '<div class="row"><button class="btn ghost" data-action="pfall"></button><button class="btn primary grow" data-action="psuse" disabled></button></div>' +
    '<button class="btn ghost sm" data-action="psnone">' + t('pf_reject') + '</button>';
}
/* How many of the models still ahead have pictures waiting: they go fastest. */
function shootSugCount() {
  var n = 0, i;
  if (!shootFindsOn()) return '';
  for (i = shoot.at; i < shoot.groups.length; i++) if (shootReady(shootFind(shoot.groups[i]))) n++;
  return n ? '<p class="sub">' + t('ps_sug_count', { n: n }) + '</p>' : '';
}
/* On to the next model, with nothing chosen and the suggestions folded. */
function shootNext() {
  var box = $('#shoot');
  shoot.at++;
  shoot.sug = false;
  finds.picks = [];
  paintShoot();
  if (box) box.scrollTop = 0;
}
function useShootFind() {
  var s = shoot, g = s && s.groups[s.at], f = g && shootFind(g), cands = shootReady(f) ? candidates({ f: f }) : [], ids,
    picked = finds.picks.map(function (i) { return cands[i]; }).filter(Boolean);
  if (!picked.length) return;
  if (!state.jobsOk) { toast(t('pf_oldcloud')); return; }
  ids = g.ids.filter(function (id) { return !g.off[id]; });
  if (!ids.length) { toast(t('ps_noneticked')); return; }
  sendChoice(f, ids, picked, function () { /* the model stays behind, as it was */ });   // the same as a choice in the review
  shootNext();
}
/* "None fits": that search is closed, and the camera, the gallery and the internet search stay. */
function shootNoneFits() {
  var g = shoot && shoot.groups[shoot.at], f = g && shootFind(g);
  if (!f) return;
  sent(api('POST', '/rest/v1/rpc/photo_decide', { p_query: f.query, p_action: 'reject' })).then(function (res) {
    if (!res) return;
    f.status = 'rejected';
    shoot.sug = false;
    finds.picks = [];
    paintShoot();
  });

/* ---------- Excel / CSV import (reader loads only when a file is picked) ---------- */
var RE_PRICE_HEAD = new RegExp(LEXICON.priceHead, 'i'), RE_SKIP_HEAD = new RegExp(LEXICON.skipHead, 'i');
function loadXlsx() {
  return new Promise(function (resolve, reject) {
    if (window.XLSX) { resolve(window.XLSX); return; }
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function () { resolve(window.XLSX); };
    s.onerror = function () { reject(new Error('xlsx reader failed to load')); };
    document.head.appendChild(s);
  });
}
function readFile(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(r.result); };
    r.onerror = function () { reject(r.error); };
    r.readAsArrayBuffer(file);
  });
}
/* rows: array of rows, each an array of trimmed cell strings. */
function rowsToOffers(rows, defCur) {
  var out = [], head = -1, priceCol = -1, skip = {}, i;
  for (i = 0; i < Math.min(rows.length, 8) && priceCol < 0; i++) {   // a header row that names the price column wins over guessing
    rows[i].forEach(function (c, j) { if (priceCol < 0 && RE_PRICE_HEAD.test(normalize(c))) { priceCol = j; head = i; } });
  }
  if (priceCol < 0) {
    rows.forEach(function (r) { var d = parseOfferLine(r.filter(Boolean).join(' | '), defCur); if (d) out.push(d); });
    return out;
  }
  var title = rows[head][priceCol], cur = new RegExp(LEXICON.syp, 'i').test(title) ? 'SYP' : (new RegExp(LEXICON.usd, 'i').test(title) ? 'USD' : defCur);
  rows[head].forEach(function (c, j) { if (RE_SKIP_HEAD.test(normalize(c))) skip[j] = true; });
  rows.slice(head + 1).forEach(function (r) {
    var price = toNumber(toLatinDigits(r[priceCol] || '').replace(/[^\d.,]/g, ''), cur);
    var name = r.filter(function (c, j) { return c && j !== priceCol && !skip[j]; }).join(' ').replace(/\s+/g, ' ').trim();
    if (name) out.push({ name: name, price: price > 0 ? price : null, cur: cur, explicit: true });
  });
  return out;
}
function readText(file) {
  return new Promise(function (resolve, reject) {
    var r = new FileReader();
    r.onload = function () { resolve(String(r.result || '')); };
    r.onerror = function () { reject(r.error); };
    r.readAsText(file);
  });
}
function importFile(file) {
  if (/\.txt$/i.test(file.name || '') || file.type === 'text/plain') {   // a list saved as plain text is read like pasted text
    readText(file).then(function (text) {
      state.pasteText = text; state.offerMode = 'paste';
      setDraft(parseOfferText(text, state.draftCur));
      paintTab();
      if (!state.draft.length) toast(t('file_fail'));
    }, function () { toast(t('file_fail')); });
    return;
  }
  Promise.all([loadXlsx(), readFile(file)]).then(function (res) {
    var XLSX = res[0];
    var wb = XLSX.read(res[1], { type: 'array', codepage: 65001 });
    var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' })
      .map(function (r) { return r.map(function (c) { return String(c).trim(); }); });
    setDraft(rowsToOffers(rows, state.draftCur));
    paintDraft();
    if (!state.draft.length) toast(t('file_fail'));
  }).catch(function () { toast(t('file_fail')); });
}

  else if (atFront()) navDrop('tab');

    var top = navTop();

  else if (a === 'share') {
    p = byId(id);
    if (p && navigator.share) navigator.share({ title: p.name, text: p.name + (hasPrice(p) ? ' - ' + px(p.sell) : ''), url: shareUrl(p) }).catch(function () { /* closed without sharing */ });
  }
  else if (a === 'copylink') {
    p = byId(id);
    if (p && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(shareUrl(p)).then(function () { toast(t(state.shareOn ? 'link_copied_wait' : 'link_copied')); }, function () { toast(t('copy_fail')); });
    else toast(t('copy_fail'));
  }
  else if (a === 'more') { state.limit += 60; paintItems(); }
  else if (a === 'golow') { resetStore(); state.lowOnly = true; state.inStockOnly = true; goTab('items'); }
  else if (a === 'open') openItem(id);
  else if (a === 'close') closeSheet();
  else if (a === 'peek') peek(id);
  else if (a === 'add') {
    p = byId(id);
    if (!p || !hasPrice(p)) { toast(t('cant_add')); return; }
    cart()[id] = (cart()[id] || 0) + 1;
    save(); paintBadge(); toast(t(isGuest() ? 'added_request' : 'added'));
    if (el.getAttribute('data-close')) closeSheet();
  }
  else if (a === 'qinc' || a === 'qdec') {
    n = (cart()[id] || 0) + (a === 'qinc' ? 1 : -1);
    if (n > 0) cart()[id] = n; else delete cart()[id];
    save(); paintTab(); paintBadge();
  }
  else if (a === 'qclear') {
    if (isGuest()) state.gquote = {};
    else { state.quote = {}; state.quoteDisc = 0; state.quoteCustomer = ''; }
    save(); paintTab(); paintBadge();
  }
  else if (a === 'qr') {
    state.qrFor = state.qrFor === id ? '' : id;
    openItem(id);
    p = $('#qr-box');
    if (p && p.scrollIntoView) p.scrollIntoView({ block: 'nearest' });
  }
  else if (a === 'qrlist') { state.qrCart = !state.qrCart; paintTab(); }
  else if (a === 'qrprint') { p = byId(id); if (p) printLabel(p); }
  else if (a === 'copy') copyQuote();
  else if (a === 'doc') openDoc();
  else if (a === 'pdfsave') savePdf();
  else if (a === 'pdfshare') sharePdf();
  else if (a === 'print') printDoc();
  else if (a === 'omode') {
    state.offerMode = el.getAttribute('data-mode');
    setDraft(state.offerMode === 'paste' ? parseOfferText(state.pasteText, state.draftCur) : []);
    paintTab();
  }
  else if (a === 'dcur') {
    state.draftCur = el.getAttribute('data-cur');
    if (state.offerMode === 'paste') setDraft(parseOfferText(state.pasteText, state.draftCur));
    else state.draft.forEach(function (d) { if (!d.explicit) d.cur = state.draftCur; });
    paintTab();
  }
  else if (a === 'drm') { state.draft.splice(Number(el.getAttribute('data-i')), 1); paintDraft(); }
  else if (a === 'dsave') saveDraft();
  else if (a === 'orm') { state.offers = state.offers.filter(function (o) { return o.id !== id; }); paintOffers(); paintDraftFoot(); removeOffer(id); }
  else if (a === 'oclist') openList(el.getAttribute('data-sup'));
  else if (a === 'osupedit') { state.supEdit = el.getAttribute('data-sup'); state.offerEdit = null; paintOfferRows(); p = $('#se-name'); if (p) p.focus(); }
  else if (a === 'osupcancel') { state.supEdit = null; paintOfferRows(); }
  else if (a === 'ofold') toggleSupplier(el.getAttribute('data-sup'));
  else if (a === 'vistop') { state.visTop = !state.visTop; paintVisits(); }
  else if (a === 'visload') loadVisits(true);
  else if (a === 'oedit') { state.offerEdit = id; state.supEdit = null; paintOfferRows(); p = $('#oe-name'); if (p) p.focus(); }
  else if (a === 'oeditcancel') { state.offerEdit = null; paintOfferRows(); }
  else if (a === 'sreq') logRequest(el);   // the link itself opens WhatsApp
  else if (a === 'dcond') { state.draftCond = el.getAttribute('data-cond'); paintTab(); }
  else if (a === 'oshow') {   // show or hide all of one supplier's offers in the store
    p = el.getAttribute('data-sup');
    n = !state.offers.some(function (o) { return inBlock(o, p) && o.listed; });
    state.offers.forEach(function (o) { if (inBlock(o, p)) o.listed = n; });
    sent(api('PATCH', '/rest/v1/offers?' + (p === OWN ? 'own=is.true'
      : 'supplier=eq.' + encodeURIComponent(p) + (state.offers.some(function (o) { return o.own; }) ? '&own=is.false' : '')), { listed: n }, 'return=minimal'));
    paintOfferRows();
  }
  else if (a === 'listcopy') copyList();
  else if (a === 'listshare') { p = $('#list-text'); if (p && navigator.share) navigator.share({ text: p.value }).catch(function () { /* closed without sharing */ }); }
  else if (a === 'osupdel') {
    p = el.getAttribute('data-sup');
    n = state.offers.filter(function (o) { return inBlock(o, p); }).map(function (o) { return o.id; });
    if (n.length && window.confirm(t('del_supplier_q', { name: p === OWN ? t('own_goods') : p, n: n.length }))) { removeOffers(n); paintOffers(); paintDraftFoot(); }
  }
  else if (a === 'ratesrc') {
    state.rateSrc = el.getAttribute('data-src');
    if (state.rateSrc === 'manual' && !(state.rateManual > 0)) state.rateManual = state.bookRate;
    useRate(); saveSetting('money'); flushLater(); paintHeader(); paintTab();   // sent at once, so a refresh under way cannot bring the old choice back
  }
  else if (a === 'sypmode') { state.sypMode = el.getAttribute('data-mode'); state.sypAuto = false; saveSetting('money'); paintTab(); }
  else if (a === 'floormode') { state.floorMode = el.getAttribute('data-mode'); saveSetting('floor'); paintTab(); }
  else if (a === 'lockmin') { state.lockMin = Number(el.getAttribute('data-min')); save(); paintTab(); }
  else if (a === 'pact') {   // approve a waiting account, or switch an active one off
    p = person(id);
    if (p) { p.active = !p.active; paintTab(); setPerson(id, { active: p.active }); }
  }
  else if (a === 'prole') {
    p = person(id);
    if (p && (p.role === 'admin' || window.confirm(t('make_admin_q', { name: p.name || p.email })))) {
      p.role = p.role === 'admin' ? 'staff' : 'admin';
      paintTab(); setPerson(id, { role: p.role });
    }
  }
});

document.addEventListener('input', function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute('data-input'), v, d, ex;
  if (!k) return;
  if (k === 'q') {   // a new search looks through the whole store, not only the group that was open
    if (!state.query.trim() && el.value.trim()) { state.cat = 'all'; state.brand = ''; state.cpu = ''; state.ram = ''; }
    state.query = el.value; state.limit = 60; paintItems(); syncBrowse();
  }
  else if (k === 'defmargin') { v = parseFloat(el.value); if (v >= 0) { state.pricing.defMargin = v; reprice(); saveRules(); } }
  else if (k === 'lowat') {
    v = parseInt(el.value, 10);
    if (v >= 0) { state.pricing.lowAt = v; state.items.forEach(function (it) { it.min = v; }); saveSetting('floor'); }
  }
  else if (k === 'gmargin') {
    v = parseFloat(el.value); d = el.getAttribute('data-cat');
    if (v >= 0) state.pricing.margins[d] = v; else delete state.pricing.margins[d];
    reprice(); saveGroup(d);
  }
  else if (k === 'gshow') {
    d = el.getAttribute('data-cat');
    if (el.checked) delete state.pricing.hidden[d]; else state.pricing.hidden[d] = true;
    saveGroup(d);
  }
  else if (k === 'gueston') { state.guestOn = el.checked; saveSetting('guest'); }
  else if (k === 'guestsyp') { state.guestSyp = el.checked; saveSetting('guest'); }
  else if (k === 'paste') { state.pasteText = el.value; setDraft(parseOfferText(el.value, state.draftCur)); paintDraft(); }
  else if (k === 'supplier') {   // a supplier with its own profit % changes the prices worked out below
    v = offerMarginPct(draftSupplier());
    state.supplier = el.value;
    if (offerMarginPct(draftSupplier()) !== v) paintDraft(); else paintDraftFoot();
  }
  else if (k === 'downown') { state.draftOwn = el.checked; d = $('#supplier'); if (d) d.parentNode.hidden = el.checked; paintDraft(); }
  else if (k === 'qspecs') { state.quoteSpecs = el.checked; save(); paintQuoteSum(); }
  else if (k === 'qphotos') { state.quotePhotos = el.checked; save(); }
  else if (k === 'staffcost') { state.staffCostOn = el.checked; saveSetting('staff_cost'); }
  else if (k === 'dqty') {   // how many of my own goods: empty keeps the usual (one, or what is there already)
    d = state.draft[Number(el.getAttribute('data-i'))];
    v = parseInt(el.value, 10);
    if (d) d.qty = v >= 0 ? v : null;
  }
  else if (k === 'dcat') state.draftCat = el.value;
  else if (k === 'dcatname') state.draftCatName = el.value;
  else if (k === 'replold') { state.replaceOld = el.checked; state.replaceTouched = true; }
  else if (k === 'omargin') {   // profit % for supplier offers; empty goes back to the general one
    v = parseFloat(el.value);
    state.offerMargin = v >= 0 ? v : null;
    saveSetting('offers'); paintDraft(); paintOfferRows();
  }
  else if (k === 'inote') saveNote(el.getAttribute('data-id'), el.value);
  else if (k === 'pfitem') { d = finds.list[finds.at]; if (d) d.off[el.getAttribute('data-id')] = !el.checked; }
  else if (k === 'photoauto') { state.photoAuto = el.checked; saveSetting('photos'); flushLater(); }
  else if (k === 'photocap') { v = parseInt(el.value, 10); if (v >= 0) { state.photoCap = v; saveSetting('photos'); } }
  else if (k === 'psitem') { d = shoot && shoot.groups[shoot.at]; if (d) d.off[el.getAttribute('data-id')] = !el.checked; }
  else if (k === 'phsugitem') sheetSug.off[el.getAttribute('data-id')] = !el.checked;
  else if (k === 'ratemanual') {   // typed in the lira shown on screen
    v = parseFloat(el.value);
    if (v > 0) { state.rateManual = v / sypFactor(); useRate(); saveSetting('money'); paintHeader(); }
  }
  else if (k === 'ofilter') { state.offerQuery = el.value; state.supFoldQ = {}; paintOfferRows(); }   // a new search unfolds every list with matches
  else if (k === 'dprice') {
    d = state.draft[Number(el.getAttribute('data-i'))];
    v = parseFloat(el.value);
    if (d) {
      d.price = v > 0 ? v : null;
      ex = $('#dc-' + el.getAttribute('data-i'));
      if (ex) ex.textContent = draftCalc(d);
      paintDraftFoot();
    }
  }
  else if (k === 'qcust') { state.quoteCustomer = el.value; save(); paintQuoteSum(); }
  else if (k === 'qdisc') {
    v = parseFloat(el.value) || 0;
    if (v > discountCap()) { v = discountCap(); el.value = v; toast(t('disc_capped')); }
    state.quoteDisc = Math.max(0, v);
    save(); paintQuoteSum();
  }
  else if (k === 'disc') { v = parseFloat(el.value); if (v >= 0 && v <= 100) { state.maxDiscount = v; saveSetting('floor'); } }
  else if (k === 'shopname') { state.shop.name = el.value; saveSetting('shop'); }
  else if (k === 'shopphone') { state.shop.phone = el.value; saveSetting('shop'); }
  else if (k === 'shopnote') { state.shop.note = el.value; saveSetting('shop'); }
  else if (k === 'validdays') { v = parseInt(el.value, 10); if (v > 0) { state.shop.validDays = v; saveSetting('shop'); } }
  else if (k === 'codeword') {
    v = el.value.toUpperCase().replace(/\s/g, '');
    ex = $('#code-ex');
    if (validWord(v)) { state.codeWord = v; saveSetting('floor'); if (ex) ex.textContent = codeExample(); }
    else if (ex) ex.textContent = t('code_bad');
  }
});

document.addEventListener('change', function (e) {
  var el = e.target, k = el.getAttribute && el.getAttribute('data-change'), id, v, it;
  if (el.id === 'file' && el.files && el.files[0]) importFile(el.files[0]);
  else if (el.id === 'shot' && el.files && el.files.length) readOfferPictures(el.files);
  else if (el.id === 'bk-file' && el.files && el.files[0]) { openBackup(el.files[0]); el.value = ''; }
  else if ((el.id === 'ps-cam' || el.id === 'ps-pick') && el.files && el.files.length) shootFiles(el.files);
  else if (el.id === 'ph-file' && el.files && el.files[0]) addPhotos(el.getAttribute('data-id'), el.files);
  else if (k === 'sort') { state.sort = el.value; state.limit = 60; paintItems(); }
  else if (k === 'ownqty') { it = byId(el.getAttribute('data-id')); v = parseInt(el.value, 10); if (it && it.offer && v >= 0) setOwnQty(it, v); }
  else if (k === 'extra' || k === 'manual') {   // manager's per-item adjustments, applied when the field is left
    id = el.getAttribute('data-id'); v = parseFloat(el.value); it = byId(id);
    if (!it) return;
    if (v > 0) state.pricing[k][id] = v; else delete state.pricing[k][id];
    resolveItem(it);
    savePricing(id);
    if (it.offer) {   // the store reads an offer's price from its rows in the cloud
      sent(api('PATCH', '/rest/v1/offers?id=in.(' + it.offer.rows.map(encodeURIComponent).join(',') + ')', { sell: offerOwnSell(id, it.raw.cost, offerSupplier(it)) }, 'return=minimal'));
    }
    if (state.tab === 'items') paintItems();
    openItem(id);
  }
});

document.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target.getAttribute('data-form'), p;
  if (f === 'signin') {
    var email = $('#si-email').value.trim(), pass = $('#si-pass').value;
    if (!email || !pass) { state.authMsg = t('bad_login'); paintSignIn(); return; }
    signIn(email, pass);
  } else if (f === 'supedit') {
    saveSupplier(e.target.getAttribute('data-sup'));
  } else if (f === 'oedit') {
    saveOfferEdit(e.target.getAttribute('data-id'));
  } else if (f === 'supwa') {   // a supplier's number added from a device's page
    p = waDigits(e.target.querySelector('input').value);
    if (!p) { toast(t('wa_bad')); return; }
    setSupplierWa(e.target.getAttribute('data-sup'), p);
    if (state.sheetId) openItem(state.sheetId);
  } else if (f === 'pfkey') {
    p = $('#pf-key').value.trim();
    if (p) savePhotoKey(p);
  } else if (f === 'pfagain') {
    p = $('#pf-words').value.trim();
    if (p) decideFind('again', p);
  } else if (f === 'scancode') {
    onScanned($('#scan-code').value);
  } else if (f === 'manual') {
    var name = $('#m-name').value.trim(), price = parseFloat($('#m-price').value);
    if (name && price > 0) {
      state.draft.push({ name: name, price: price, cur: state.draftCur, explicit: true });
      paintTab();
      var again = $('#m-name');
      if (again) again.focus();
    }
  }
});

document.addEventListener('keydown', function (e) {
  var hits;
  if (e.key === 'Escape' && state.zoom) closeZoom();
  else if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  else if (e.key === 'Enter' && e.target && e.target.id === 'q' && !isGuest()) {   // a hand scanner types the code and presses Enter
    hits = itemsByCode(e.target.value);
    if (hits.length === 1) { e.preventDefault(); openItem(hits[0].id); }
  }
});
window.addEventListener('afterprint', function () { $('#print-area').innerHTML = ''; });
/* a day's bar on the visitor chart, pointed at or touched: picked, with its day and count under the bars */
['pointerover', 'click'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    var b = e.target.closest && e.target.closest('.vbar'), tip = $('#vis-tip');
    if (!b || !tip) return;
    state.visDay = b.getAttribute('data-day');
    tip.textContent = b.getAttribute('data-tip');
    Array.prototype.forEach.call(document.querySelectorAll('.vbar.sel'), function (x) { x.classList.remove('sel'); });
    b.classList.add('sel');
  });
});
window.addEventListener('popstate', onNavPop);
window.addEventListener('hashchange', onHashLink);

/* ---------- Lock after no activity (only when fingerprint or face unlock is on) ---------- */
var lastAct = Date.now();
['pointerdown', 'keydown'].forEach(function (ev) {
  document.addEventListener(ev, function () { lastAct = Date.now(); }, true);
});
setInterval(function () {
  if (state.screen === 'app' && !isGuest() && bioId() && state.lockMin > 0 && Date.now() - lastAct > state.lockMin * 60000) lockApp();
}, 5000);

/* ---------- Keeping in step with the cloud ---------- */
setInterval(poll, CLOUD.pollMs);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { flushLater(); sitePing(true); } else { poll(); sitePing(); if (state.tab === 'overview') loadVisits(true); }
});
/* a visitor's report while the store stays on its screen */
setInterval(function () { if (Date.now() - VISIT.last > 15000) sitePing(); }, 20000);
window.addEventListener('pagehide', siteBye);
window.addEventListener('online', poll);

/* ---------- Start ---------- */
VISIT.via = /^#p\d+$/.test(location.hash) ? 'item' : (LIST_RE.test(location.hash) ? 'list' : '');   // opened from a shared link
startLink = location.hash;   // opened once the store is in, as a step over it, so back shows the store
try { history.replaceState({ raff: 0 }, '', navBase()); if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) { /* no history here */ }
load();
render();
bioCheck();
loadShareInfo();
if (!state.session) enterGuest();                      // the store opens at once, no sign-in asked
else if (bioId()) { state.screen = 'locked'; render(); }
else startSession();
})();
</script>
</body>
</html>
